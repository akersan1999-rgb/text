<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KPSS Deneme Sınavı 🎯</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans',sans-serif }
        body {
            background: #0f0b19; color: #f1f5f9; min-height:100vh; display:flex; justify-content:center; align-items:center;
            background-image: radial-gradient(circle at 30% 40%, rgba(244,63,94,0.08) 0%, transparent 50%),
                              radial-gradient(circle at 70% 60%, rgba(99,102,241,0.06) 0%, transparent 50%);
            padding: 20px;
        }
        .container { max-width:750px; width:100% }
        .screen { display:none; background: linear-gradient(145deg, #19132e, #22183e); border-radius:28px; padding:35px 25px; border:1px solid #3c244f; box-shadow:0 20px 40px rgba(0,0,0,0.5); margin-bottom:20px; position:relative; overflow:hidden }
        .screen.active { display:block; animation: fadeIn 0.4s ease }
        @keyframes fadeIn { from { opacity:0; transform:translateY(10px) } to { opacity:1; transform:translateY(0) } }
        h2 { color:#fff; margin-bottom:20px; text-align:center; font-weight:800; font-size:2rem; letter-spacing:-0.5px }
        h3 { color:#f43f5e; margin-bottom:15px }
        input, button { width:100%; padding:16px; border-radius:14px; margin-bottom:15px; border:2px solid #3c244f; background:#0f0b19; color:#fff; font-size:1rem; outline:none; transition:0.3s }
        input:focus { border-color:#f43f5e }
        button { background:linear-gradient(135deg, #f43f5e, #ec4899); border:none; font-weight:700; cursor:pointer; letter-spacing:0.5px; font-size:1.1rem }
        button:hover { transform:translateY(-2px); box-shadow:0 10px 25px rgba(244,63,94,0.3) }
        button:disabled { opacity:0.5; cursor:not-allowed; transform:none; box-shadow:none }
        .timer { background:rgba(244,63,94,0.15); border:1px solid rgba(244,63,94,0.3); padding:15px; border-radius:14px; text-align:center; margin-bottom:20px; font-size:1.3rem; font-weight:700; color:#fff; letter-spacing:1px }
        .progress { display:flex; justify-content:space-between; background:#19132e; padding:12px 20px; border-radius:14px; margin-bottom:20px; border:1px solid #3c244f }
        .q-box { background:#19132e; border:1px solid #3c244f; border-radius:18px; padding:20px; margin-bottom:15px; transition:0.3s }
        .q-box.selected { border-color:#f43f5e; box-shadow:0 0 15px rgba(244,63,94,0.15) }
        .options { display:flex; flex-direction:column; gap:10px; margin-top:15px }
        .opt { padding:14px 18px; border:2px solid #3c244f; border-radius:12px; cursor:pointer; display:flex; align-items:center; gap:10px; transition:0.2s; background:rgba(15,11,25,0.4) }
        .opt:hover { border-color:#f43f5e; background:rgba(244,63,94,0.08) }
        .opt.chosen { border-color:#f43f5e; background:rgba(244,63,94,0.12) }
        .opt.chosen::before { content:'✓'; color:#f43f5e; font-weight:bold; font-size:1.2rem }
        .blank-opt { border-style:dashed; color:#cbd5e1 }
        .admin-panel { background:linear-gradient(145deg, #1a1330, #221840); border:1px solid #f43f5e; border-radius:20px; padding:20px; margin-top:25px; box-shadow:0 10px 30px rgba(0,0,0,0.5) }
        .admin-row { display:flex; gap:10px; margin-bottom:15px; align-items:center }
        .admin-row input { flex:1; margin-bottom:0 }
        .list-item { padding:12px 15px; border-bottom:1px solid #3c244f; cursor:pointer; display:flex; justify-content:space-between; align-items:center; transition:0.2s; border-radius:8px }
        .list-item:hover { background:rgba(244,63,94,0.08) }
        .list-item.selected { background:rgba(244,63,94,0.15); border-left:4px solid #f43f5e }
        .detail { background:rgba(0,0,0,0.3); padding:15px; border-radius:12px; margin-top:15px; font-size:0.9rem; max-height:250px; overflow-y:auto }
        .green { color:#10b981 } .red { color:#ef4444 } .gray { color:#6b7280 }
        .stats-grid { display:flex; justify-content:space-around; background:rgba(0,0,0,0.3); padding:15px; border-radius:14px; margin-bottom:20px; text-align:center }
        .stats-item { flex:1 }
        .stats-item span { display:block; font-size:2rem; font-weight:800; color:#f43f5e }
        .btn-sm { padding:10px 20px; font-size:0.9rem; width:auto; margin:5px }
        .link-input { background:#0f0b19; border:1px dashed #f43f5e; color:#f43f5e; text-align:center; margin:15px 0; cursor:pointer }
        .print-only { display:none }
        @media print {
            body { background:white; color:black }
            .screen { box-shadow:none; border:1px solid #ccc; background:white; color:black }
            .admin-panel, .timer, .progress, button, .link-input { display:none !important }
            .print-only { display:block }
        }
        .error-message { color:#f43f5e; background:rgba(244,63,94,0.1); padding:10px; border-radius:8px; margin-bottom:15px; text-align:center }
    </style>
</head>
<body>
<div class="container">
    <!-- GİRİŞ EKRANI -->
    <div class="screen active" id="loginScreen">
        <h2>🎯 KPSS Deneme Sınavı</h2>
        <p style="text-align:center; margin-bottom:25px; color:#cbd5e1">Lütfen bilgilerini eksiksiz doldur, tek giriş hakkın var.</p>
        <div id="loginError" class="error-message" style="display:none"></div>
        <input type="text" id="nameInput" placeholder="Adın" />
        <input type="text" id="surnameInput" placeholder="Soyadın" />
        <input type="email" id="emailInput" placeholder="E-posta adresin" />
        <button id="startBtn">Sınava Başla 🚀</button>
    </div>

    <!-- SINAV EKRANI -->
    <div class="screen" id="examScreen">
        <div class="timer" id="timerDisplay">⏱️ 30:00</div>
        <div class="progress">
            <span>Cevaplanan: <span id="answeredCount">0</span>/20</span>
            <span>İlerleme: <span id="progressPercent">0</span>%</span>
        </div>
        <div id="questionsContainer"></div>
        <button id="finishBtn">Sınavı Bitir ve Gönder ✨</button>
    </div>

    <!-- BEKLEME EKRANI -->
    <div class="screen" id="waitScreen">
        <h2>⏳ Sınavın Kaydedildi</h2>
        <p style="text-align:center; margin-bottom:15px">Sonuç linkini kopyala veya bekle, yönetici yayınlayınca görünecek.</p>
        <input class="link-input" id="linkBox" readonly onclick="this.select();document.execCommand('copy')" value="" />
        <button id="checkBtn">📊 Sonuçlarımı Gör</button>
    </div>

    <!-- SONUÇ EKRANI -->
    <div class="screen" id="resultScreen">
        <div class="stats-grid">
            <div class="stats-item"><span id="scoreDisplay">0</span>Puan</div>
            <div class="stats-item"><span id="correctDisplay">0</span>Doğru</div>
            <div class="stats-item"><span id="wrongDisplay">0</span>Yanlış</div>
            <div class="stats-item"><span id="emptyDisplay">0</span>Boş</div>
        </div>
        <p style="text-align:center; margin-bottom:20px; font-size:1.1rem" id="nameSurnameDisplay"></p>
        <div id="analysisContainer"></div>
        <button id="pdfBtn" class="btn-sm" style="background:#6366f1">📄 PDF Olarak Kaydet</button>
    </div>

    <!-- YÖNETİCİ PANELİ -->
    <div class="admin-panel">
        <h3 style="text-align:center; margin-bottom:15px">🔐 Yönetici Paneli</h3>
        <div class="admin-row">
            <input type="password" id="adminPass" placeholder="Yönetici şifresi" />
            <button id="adminLoginBtn" style="width:auto">Giriş</button>
        </div>
        <div id="adminError" class="error-message" style="display:none"></div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px">
            <strong>📋 Sınav Listesi</strong>
            <span id="totalExams" style="color:#a5b4fc"></span>
        </div>
        <div id="examList" style="max-height:200px; overflow-y:auto; background:rgba(0,0,0,0.2); border-radius:10px; padding:5px"></div>
        <div class="detail" id="detailPanel" style="display:none"></div>
        <div id="adminActions" style="display:none; margin-top:15px; display:flex; gap:10px; flex-wrap:wrap">
            <button id="yayinlaBtn" style="background:#10b981; flex:1">✅ Yayınla</button>
            <button id="kilitleBtn" style="background:#f59e0b; flex:1">🔒 Kilitle</button>
            <button id="silBtn" style="background:#ef4444; flex:1">🧹 Tümünü Sil</button>
        </div>
        <p id="adminMsg" style="text-align:center; margin-top:10px; color:#fbbf24"></p>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, push, set, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyCuj-l1GPAWz4wFrP209LCY2B_zr2_m8dg",
    authDomain: "test-ba1a3.firebaseapp.com",
    databaseURL: "https://test-ba1a3-default-rtdb.europe-west1.firebasedatabase.app/",
    projectId: "test-ba1a3",
    storageBucket: "test-ba1a3.firebasestorage.app",
    messagingSenderId: "413174140566",
    appId: "1:413174140566:web:f7eefa4717579784b3bcb7"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const examsRef = ref(db, 'exams');

const ADMIN_PASSWORD = "1923";

const questions = [
    { q: "Türkiye'de görülmeyen iklim?", o: ["Akdeniz","Karasal","Muson","Karadeniz","Marmara"], a:2, n:"Muson Asya'da görülür." },
    { q: "TBMM açılış tarihi?", o: ["23 Nisan 1920","29 Ekim 1923","19 Mayıs 1919","30 Ağustos 1922","15 Temmuz 2016"], a:0, n:"23 Nisan 1920." },
    { q: "Isı alışveriş türü olmayan?", o: ["Konveksiyon","Radyasyon","Kondüksiyon","Adveksiyon","Süblimleşme"], a:4, n:"Süblimleşme hal değişimi." },
    { q: "TDK amacı?", o: ["Arındırmak","Doğru kullanım","Geliştirmek","Hepsi","Hiçbiri"], a:3, n:"Hepsi." },
    { q: "Batı Cephesi'nde yapılmayan savaş?", o: ["I.İnönü","II.İnönü","Kütahya-Eskişehir","Sakarya","Çanakkale"], a:4, n:"Çanakkale." },
    { q: "En uzun akarsu?", o: ["Fırat","Dicle","Kızılırmak","Sakarya","Yeşilırmak"], a:2, n:"Kızılırmak." },
    { q: "Tanzimat Fermanı padişahı?", o: ["II.Mahmud","Abdülmecid","Abdülaziz","V.Murad","II.Abdülhamid"], a:1, n:"Abdülmecid." },
    { q: "UNESCO şehri?", o: ["İstanbul","Ankara","İzmir","Bursa","Antalya"], a:0, n:"İstanbul." },
    { q: "En yağışlı bölge?", o: ["D.Anadolu","Karadeniz","Akdeniz","Ege","Marmara"], a:1, n:"Karadeniz." },
    { q: "Halkçılık neyi savunur?", o: ["Milli birlik","Sosyal adalet","Laiklik","Devletçilik","Cumhuriyet"], a:1, n:"Sosyal adalet." },
    { q: "Milli park olmayan?", o: ["Göreme","Olimpos","Yedigöller","Sapanca","Kazdağları"], a:3, n:"Sapanca." },
    { q: "En kalabalık şehir?", o: ["Ankara","İstanbul","İzmir","Bursa","Antalya"], a:1, n:"İstanbul." },
    { q: "Yapım eki?", o: ["-ler","-de","-den","-lik","-e"], a:3, n:"-lik yapım eki." },
    { q: "Türkiye'de çıkarılmayan?", o: ["Kömür","Demir","Altın","Elmas","Boksit"], a:3, n:"Elmas." },
    { q: "Cumhuriyet ilanı?", o: ["1920","1921","1922","1923","1924"], a:3, n:"1923." },
    { q: "Ulaşım türü değil?", o: ["Kara","Deniz","Hava","Demir","Uzay"], a:4, n:"Uzay." },
    { q: "En büyük göl?", o: ["Van","Tuz","Beyşehir","Eğirdir","İznik"], a:0, n:"Van Gölü." },
    { q: "Anadolu uygarlığı değil?", o: ["Hitit","Frig","Urartu","Mısır","Lidya"], a:3, n:"Mısır." },
    { q: "Başkent?", o: ["Ankara","İstanbul","İzmir","Bursa","Eskişehir"], a:0, n:"Ankara." },
    { q: "Yazılım dili olmayan?", o: ["Python","Java","C++","HTML","Photoshop"], a:4, n:"Photoshop." }
];

let userData = { name:'', surname:'', email:'' };
let examId = null;
let answers = new Array(20).fill('blank');
let answeredSet = new Set();
let timer, remaining = 1800;

function switchScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

// Giriş kontrolü
document.getElementById('startBtn').addEventListener('click', async () => {
    const name = document.getElementById('nameInput').value.trim();
    const surname = document.getElementById('surnameInput').value.trim();
    const email = document.getElementById('emailInput').value.trim();
    const errorDiv = document.getElementById('loginError');
    errorDiv.style.display = 'none';

    if (!name || !surname || !email.includes('@')) {
        errorDiv.textContent = 'Lütfen tüm alanları doğru doldurun.';
        errorDiv.style.display = 'block';
        return;
    }

    // Daha önce bu e-posta ile sınav girilmiş mi?
    const snap = await get(examsRef);
    const exams = snap.val() || {};
    const alreadyTaken = Object.values(exams).some(ex => ex.email === email && ex.status === 'completed');
    if (alreadyTaken) {
        errorDiv.textContent = 'Bu e-posta adresiyle zaten bir sınav girilmiş. Tek hakkınız var.';
        errorDiv.style.display = 'block';
        return;
    }

    userData = { name, surname, email };
    switchScreen('examScreen');
    renderQuestions();
    startTimer();
});

function startTimer() {
    timer = setInterval(() => {
        remaining--;
        const m = Math.floor(remaining/60), s = remaining%60;
        document.getElementById('timerDisplay').textContent = `⏱️ ${m<10?'0'+m:m}:${s<10?'0'+s:s}`;
        if (remaining <= 0) { clearInterval(timer); finishExam(); }
    }, 1000);
}

function renderQuestions() {
    let html = '';
    questions.forEach((q, i) => {
        html += `<div class="q-box" id="qbox-${i}"><strong>Soru ${i+1}:</strong> ${q.q}<div class="options">`;
        q.o.forEach((opt, oi) => {
            html += `<div class="opt" data-q="${i}" data-o="${oi}">${opt}</div>`;
        });
        html += `<div class="opt blank-opt" data-q="${i}" data-o="blank">Boş bırak</div></div></div>`;
    });
    document.getElementById('questionsContainer').innerHTML = html;
    document.querySelectorAll('.opt').forEach(el => {
        el.addEventListener('click', function() {
            const q = +this.dataset.q, o = this.dataset.o;
            answers[q] = o === 'blank' ? 'blank' : +o;
            answeredSet.add(q);
            document.getElementById(`qbox-${q}`).classList.add('selected');
            document.querySelectorAll(`#qbox-${q} .opt`).forEach(e => e.classList.remove('chosen'));
            this.classList.add('chosen');
            document.getElementById('answeredCount').textContent = answeredSet.size;
            document.getElementById('progressPercent').textContent = Math.round(answeredSet.size/20*100);
        });
    });
}

async function finishExam() {
    const btn = document.getElementById('finishBtn');
    btn.disabled = true; btn.textContent = 'Gönderiliyor...';
    try {
        clearInterval(timer);
        let correct=0, wrong=0, empty=0;
        const ans = answers.map((val,i) => {
            if (val === 'blank') { empty++; return 'blank'; }
            if (val === questions[i].a) { correct++; return val; }
            wrong++; return val;
        });
        const score = Math.round(correct/20*100);
        const newRef = push(examsRef);
        examId = newRef.key;
        await set(newRef, {
            ...userData,
            score, correct, wrong, empty, answers:ans,
            status:'completed', revealed:false, submittedAt: Date.now()
        });
        switchScreen('waitScreen');
        const link = `${location.origin}${location.pathname}?exam=${examId}`;
        document.getElementById('linkBox').value = link;
        navigator.clipboard?.writeText(link);
    } catch(e) {
        alert('Hata: ' + e.message);
    } finally {
        btn.disabled = false; btn.textContent = 'Sınavı Bitir ve Gönder ✨';
    }
}

function showResult(data) {
    switchScreen('resultScreen');
    document.getElementById('scoreDisplay').textContent = data.score;
    document.getElementById('correctDisplay').textContent = data.correct;
    document.getElementById('wrongDisplay').textContent = data.wrong;
    document.getElementById('emptyDisplay').textContent = data.empty;
    document.getElementById('nameSurnameDisplay').textContent = `${data.name} ${data.surname} - ${data.email}`;
    
    let html = '';
    questions.forEach((q,i) => {
        const ua = data.answers[i];
        let cls='gray', status='⬜ Boş', choice='Seçilmedi';
        if (ua !== 'blank') {
            choice = q.o[ua];
            cls = ua===q.a ? 'green' : 'red';
            status = ua===q.a ? '✅ Doğru' : '❌ Yanlış';
        }
        html += `<div style="border-left:4px solid ${cls==='green'?'#10b981':(cls==='red'?'#ef4444':'#6b7280')}; padding:12px; margin:8px 0; background:#19132e; border-radius:10px">
            <b>Soru ${i+1}:</b> ${q.q}<br>
            <b>Cevabın:</b> <span class="${cls}">${choice}</span> (${status})<br>
            <b>Doğru Cevap:</b> ${q.o[q.a]}<br>
            <small>💡 ${q.n}</small>
        </div>`;
    });
    document.getElementById('analysisContainer').innerHTML = html;
}

// URL'den otomatik sonuç
const params = new URLSearchParams(location.search);
const examParam = params.get('exam');
if (examParam) {
    get(ref(db, `exams/${examParam}`)).then(snap => {
        const d = snap.val();
        if (d && d.revealed) showResult(d);
        else document.getElementById('loginScreen').innerHTML = '<h2>Sonuç henüz yayınlanmadı veya link geçersiz.</h2>';
    });
}

document.getElementById('checkBtn').addEventListener('click', async () => {
    if (!examId) return;
    const snap = await get(ref(db, `exams/${examId}`));
    const d = snap.val();
    if (d && d.revealed) showResult(d);
    else alert('Sonuç henüz yayınlanmadı.');
});

onValue(ref(db, `exams/${examId}`), snap => {
    const d = snap.val();
    if (d && d.revealed && document.getElementById('waitScreen').classList.contains('active')) showResult(d);
});

// PDF butonu
document.getElementById('pdfBtn').addEventListener('click', () => {
    window.print();
});

// YÖNETİCİ PANELİ
let allExams = {}, selectedId = null;
const adminMsg = document.getElementById('adminMsg');
const adminError = document.getElementById('adminError');

document.getElementById('adminLoginBtn').addEventListener('click', () => {
    if (document.getElementById('adminPass').value.trim() === ADMIN_PASSWORD) {
        document.getElementById('adminPass').disabled = true;
        document.getElementById('adminLoginBtn').disabled = true;
        adminError.style.display = 'none';
        adminMsg.textContent = '✅ Giriş başarılı, veriler yükleniyor...';
        onValue(examsRef, snap => {
            allExams = snap.val() || {};
            renderExamList();
            document.getElementById('totalExams').textContent = `Toplam ${Object.keys(allExams).length} sınav`;
        });
    } else {
        adminError.textContent = 'Şifre yanlış!';
        adminError.style.display = 'block';
    }
});

function renderExamList() {
    const list = document.getElementById('examList');
    const ids = Object.keys(allExams);
    if (!ids.length) { list.innerHTML = '<div style="padding:10px;text-align:center">Henüz sınav kaydı yok.</div>'; return; }
    let html = '';
    ids.sort((a,b) => allExams[b].submittedAt - allExams[a].submittedAt).forEach(id => {
        const ex = allExams[id];
        const date = new Date(ex.submittedAt).toLocaleString('tr-TR');
        html += `<div class="list-item" data-id="${id}">
            <div><strong>${ex.name} ${ex.surname}</strong><br><small>${ex.email}</small></div>
            <div style="text-align:right"><span style="font-weight:700; color:#f43f5e">${ex.score}p</span><br><small>${date}</small> ${ex.revealed?'✅':'🔒'}</div>
        </div>`;
    });
    list.innerHTML = html;
    document.querySelectorAll('.list-item').forEach(el => {
        el.addEventListener('click', () => {
            document.querySelectorAll('.list-item').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
            selectedId = el.dataset.id;
            showExamDetail(selectedId);
            document.getElementById('adminActions').style.display = 'flex';
        });
    });
}

function showExamDetail(id) {
    const ex = allExams[id];
    if (!ex) return;
    let html = `<strong>${ex.name} ${ex.surname}</strong> (${ex.email})<br>
        Puan: <span style="color:#f43f5e; font-size:1.2rem">${ex.score}</span> | ✅${ex.correct} ❌${ex.wrong} ⬜${ex.empty}<br>
        Tarih: ${new Date(ex.submittedAt).toLocaleString()}<hr>`;
    questions.forEach((q,i) => {
        const ua = ex.answers[i];
        const uText = ua==='blank' ? 'Boş' : q.o[ua];
        const ok = ua!=='blank' && ua===q.a;
        html += `<div style="font-size:0.85rem; color:${ua==='blank'?'gray':(ok?'#10b981':'#ef4444')}">${i+1}. ${uText} ${ua==='blank'?'':(ok?'✓':'✗')}</div>`;
    });
    document.getElementById('detailPanel').innerHTML = html;
    document.getElementById('detailPanel').style.display = 'block';
}

document.getElementById('yayinlaBtn').addEventListener('click', async () => {
    if (!selectedId) return;
    await update(ref(db, `exams/${selectedId}`), { revealed: true });
    adminMsg.textContent = '✅ Sınav yayınlandı.';
});
document.getElementById('kilitleBtn').addEventListener('click', async () => {
    if (!selectedId) return;
    await update(ref(db, `exams/${selectedId}`), { revealed: false });
    adminMsg.textContent = '🔒 Sınav kilitlendi.';
});
document.getElementById('silBtn').addEventListener('click', () => {
    if (confirm('TÜM SINAV KAYITLARI SİLİNECEK! Emin misiniz?')) {
        set(examsRef, null).then(() => {
            adminMsg.textContent = '🗑️ Tüm veriler silindi, sayfa yenileniyor...';
            setTimeout(() => location.reload(), 1500);
        });
    }
});

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KPSS Deneme Sınavı 🎯</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
  <style>
    :root {
      --bg:#0b0914; --surface:#161325; --card:#1e1a2f; --border:#2d2844;
      --accent:#f43f5e; --accent2:#ec4899; --text:#e8e4f0; --text2:#b0aac0;
      --success:#10b981; --warning:#f59e0b; --danger:#ef4444; --info:#6366f1;
    }
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}
    body{
      background:linear-gradient(135deg, #0b0914 0%, #1a1030 50%, #0b0914 100%);
      background-size:400% 400%;animation:bgMove 15s ease infinite;
      color:var(--text);min-height:100vh;overflow-x:hidden;
    }
    @keyframes bgMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
    .container{max-width:800px;margin:0 auto;padding:20px}

    .sticky-bar{
      position:sticky;top:0;z-index:100;background:var(--surface);border:1px solid var(--border);
      border-radius:0 0 16px 16px;padding:12px 20px;margin-bottom:20px;
      display:none;justify-content:space-between;align-items:center;
      box-shadow:0 5px 20px rgba(0,0,0,0.5);backdrop-filter:blur(10px);
    }

    .screen{display:none;background:var(--surface);border-radius:24px;padding:35px 30px;border:1px solid var(--border);margin-bottom:20px;box-shadow:0 20px 40px rgba(0,0,0,0.5);animation:screenIn 0.5s ease}
    .screen.active{display:block}
    @keyframes screenIn{from{opacity:0;transform:translateY(20px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}

    h2{color:#fff;margin-bottom:20px;text-align:center;font-weight:800;font-size:2.2rem}
    input,button{width:100%;padding:14px 16px;border-radius:12px;margin-bottom:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:0.95rem;outline:none}
    input:focus{border-color:var(--accent)}
    button{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;font-weight:700;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;gap:8px;transition:0.3s}
    button:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(244,63,94,0.4)}
    .row{display:flex;gap:10px}.row>*{flex:1}
    .back-btn{background:var(--info);width:auto;padding:12px 24px;margin-bottom:20px;display:inline-flex;border-radius:10px}

    .stats-grid{display:flex;justify-content:space-around;background:rgba(0,0,0,0.3);padding:20px;border-radius:16px;margin-bottom:20px;text-align:center}
    .stats-item .value{display:block;font-size:2.8rem;font-weight:800;color:var(--accent)}.stats-item .label{font-size:0.9rem;color:var(--text2)}

    .opt{padding:14px 16px;border:1px solid var(--border);border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:10px;margin-bottom:8px;background:var(--card);transition:0.3s}
    .opt:hover{border-color:var(--accent);background:rgba(244,63,94,0.06)}.opt.chosen{border-color:var(--accent);background:rgba(244,63,94,0.15)}.opt.chosen::before{content:'✓';color:var(--accent);font-weight:bold;font-size:1.3rem}.blank-opt{border-style:dashed;color:var(--text2)}

    .link-box{background:var(--bg);border:1px dashed var(--accent);padding:14px;border-radius:10px;text-align:center;color:var(--accent);margin:15px 0;word-break:break-all;cursor:pointer;font-size:0.9rem}
    .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:999;justify-content:center;align-items:center}.modal.active{display:flex}
    .modal-content{background:var(--surface);padding:30px;border-radius:20px;width:90%;max-width:600px;border:1px solid var(--accent);max-height:90vh;overflow-y:auto}
    .close-modal{float:right;font-size:1.6rem;cursor:pointer;color:var(--text2)}.close-modal:hover{color:#fff}
    .list-item{padding:14px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;align-items:center}.list-item:hover{background:rgba(244,63,94,0.06)}
    .tabs{display:flex;gap:8px;margin-bottom:15px}.tab{padding:10px 18px;background:var(--card);border-radius:10px;cursor:pointer;color:var(--text2);border:1px solid var(--border)}.tab.active{background:var(--accent);color:#fff}
    .btn-sm{padding:8px 16px;font-size:0.85rem;width:auto;border-radius:10px;margin:0 3px}
    .admin-fab{position:fixed;bottom:30px;right:30px;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;font-size:1.6rem;cursor:pointer;box-shadow:0 8px 25px rgba(244,63,94,0.5);z-index:99;display:flex;align-items:center;justify-content:center}
  </style>
</head>
<body>
<div class="container">
  <div class="sticky-bar" id="stickyBar">
    <span class="timer" id="stickyTimer">⏱️ 30:00</span>
    <span>Cevaplanan: <strong id="stickyAnswered">0</strong>/<strong id="stickyTotal">20</strong></span>
    <span>İlerleme: <strong id="stickyProgress">0</strong>%</span>
  </div>

  <!-- Giriş -->
  <div class="screen active" id="loginScreen">
    <h2>🎯 KPSS Deneme Sınavı</h2>
    <p style="text-align:center;margin-bottom:25px;color:var(--text2)">Ad, soyad ve e-posta ile giriş yap. Tek hakkın var!</p>
    <div id="loginError" style="display:none;color:var(--danger);text-align:center;margin-bottom:10px;background:rgba(239,68,68,0.08);padding:12px;border-radius:10px"></div>
    <div class="row"><input type="text" id="nameInput" placeholder="Adın"/><input type="text" id="surnameInput" placeholder="Soyadın"/></div>
    <input type="email" id="emailInput" placeholder="E-posta adresin"/>
    <button id="startBtn">🚀 Sınava Başla</button>
    <p style="text-align:center;margin-top:25px;font-size:0.85rem;color:var(--text2)">📧 İletişim: <a href="mailto:akersan1999@gmail.com" style="color:var(--info)">akersan1999@gmail.com</a></p>
  </div>

  <!-- Sınav -->
  <div class="screen" id="examScreen">
    <button class="back-btn" id="backToHomeBtn">⬅️ Ana Sayfa</button>
    <button class="back-btn" id="refreshQuestionsBtn" style="background:var(--success);margin-left:10px">🔄 Yeni 20 Soru</button>
    <div id="questionsContainer" style="margin-top:20px"></div>
    <button id="finishBtn" style="margin-top:20px">✨ Sınavı Bitir ve Gönder</button>
  </div>

  <!-- Bekleme -->
  <div class="screen" id="waitScreen">
    <button class="back-btn" id="backToHomeWaitBtn">⬅️ Ana Sayfa</button>
    <h2>⏳ Sınavın Kaydedildi</h2>
    <div class="link-box" id="linkBox" title="Tıkla kopyala"></div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button id="copyLinkBtn" style="background:var(--info)">📋 Kopyala</button>
      <button id="shareWhatsAppBtn" style="background:#25D366">💬 WhatsApp</button>
    </div>
    <button id="checkBtn" style="margin-top:10px">📊 Sonuçlarımı Gör</button>
  </div>

  <!-- Sonuç -->
  <div class="screen" id="resultScreen">
    <button class="back-btn" id="backToHomeResultBtn">⬅️ Ana Sayfa</button>
    <div class="stats-grid">
      <div class="stats-item"><span class="value" id="scoreDisplay">0</span><span class="label">Puan</span></div>
      <div class="stats-item"><span class="value" id="correctDisplay">0</span><span class="label">Doğru</span></div>
      <div class="stats-item"><span class="value" id="wrongDisplay">0</span><span class="label">Yanlış</span></div>
      <div class="stats-item"><span class="value" id="emptyDisplay">0</span><span class="label">Boş</span></div>
    </div>
    <p style="text-align:center;margin:20px 0;font-weight:600" id="nameSurnameDisplay"></p>
    <div id="analysisContainer"></div>
    <div style="display:flex;gap:8px;margin-top:15px">
      <button id="shareWhatsAppResult" style="background:#25D366">💬 WhatsApp</button>
      <button id="sendMailResult" style="background:#EA4335">📧 Sonucu Mail Gönder</button>
    </div>
  </div>
</div>

<!-- Yönetici Modal -->
<div class="modal" id="adminModal">
  <div class="modal-content">
    <span class="close-modal" id="closeAdminModal">&times;</span>
    <h3>🔐 Yönetici Paneli</h3>
    <div id="adminLoginForm">
      <input type="password" id="adminPass" placeholder="Yönetici şifresi"/>
      <button id="adminLoginBtn">Giriş Yap</button>
    </div>
    <div id="adminMain" style="display:none">
      <div class="tabs">
        <div class="tab active" data-tab="exams">📋 Sınavlar</div>
        <div class="tab" data-tab="questions">📚 Soru Kütüphanesi</div>
      </div>
      <div id="examsTab">
        <p><span id="totalExams">0</span> sınav kaydı</p>
        <div id="examList"></div>
        <div id="detailPanel" style="display:none"></div>
        <div id="adminActions" style="display:none;margin-top:10px;display:flex;gap:8px">
          <button id="yayinlaBtn" style="background:var(--success)">✅ Yayınla & Mail Gönder</button>
          <button id="kilitleBtn" style="background:var(--warning);color:#000">🔒 Kilitle</button>
        </div>
      </div>
      <div id="questionsTab" style="display:none">
        <button id="addQuestionBtn" style="background:var(--success)">➕ Yeni Soru Ekle</button>
        <div id="questionList"></div>
      </div>
    </div>
  </div>
</div>
<button class="admin-fab" id="openAdminBtn">🔐</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, push, set, onValue, update, get, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCuj-l1GPAWz4wFrP209LCY2B_zr2_m8dg",
  authDomain: "test-ba1a3.firebaseapp.com",
  databaseURL: "https://test-ba1a3-default-rtdb.europe-west1.firebasedatabase.app/",
  projectId: "test-ba1a3",
  storageBucket: "test-ba1a3.firebasestorage.app",
  messagingSenderId: "413174140566",
  appId: "1:413174140566:web:f7eefa4717579784b3bcb7"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const examsRef = ref(db, 'exams');
const questionsRef = ref(db, 'questions');
const ADMIN_PASSWORD = "1923";

const MAIL_PUBLIC_KEY = "dbF3yWuvy9um9nAdp";
const MAIL_SERVICE_ID = "service_qdab76q";
const MAIL_TEMPLATE_ID = "template_64cuej9";

// Soru havuzu
const questionPool = [
  { q:"Türkiye'nin en kalabalık şehri?", o:["Ankara","İstanbul","İzmir","Bursa","Antalya"], a:1, d:"easy", n:"İstanbul." },
  { q:"TBMM açılış tarihi?", o:["23 Nisan 1920","29 Ekim 1923","19 Mayıs 1919","30 Ağustos 1922","15 Temmuz 2016"], a:0, d:"easy", n:"23 Nisan 1920." },
  { q:"Doğal afet olmayan?", o:["Deprem","Sel","Çığ","Trafik kazası","Heyelan"], a:3, d:"easy", n:"İnsan kaynaklı." },
  { q:"Su buharının sıvıya dönüşmesi?", o:["Buharlaşma","Yoğuşma","Süblimleşme","Erime","Donma"], a:1, d:"medium", n:"Yoğuşma." },
  { q:"İstanbul'u fetheden padişah?", o:["Fatih","Kanuni","Yavuz","II.Mahmut","Abdülmecid"], a:0, d:"easy", n:"Fatih Sultan Mehmet." },
  { q:"En uzun akarsu?", o:["Fırat","Dicle","Kızılırmak","Sakarya","Yeşilırmak"], a:2, d:"medium", n:"Kızılırmak." },
  { q:"Cumhuriyet ilan yılı?", o:["1920","1921","1922","1923","1924"], a:3, d:"easy", n:"1923." },
  { q:"Almanya başkenti?", o:["Paris","Berlin","Londra","Roma","Madrid"], a:1, d:"medium", n:"Berlin." },
  { q:"Çift ünlü içeren kelime?", o:["Türk","Aile","Kalem","Kitap","Defter"], a:1, d:"medium", n:"Aile." },
  { q:"1 m = ? cm", o:["10","100","1000","10000","100000"], a:1, d:"easy", n:"100 cm." },
  { q:"En büyük okyanus?", o:["Atlas","Hint","Pasifik","Arktik","Güney"], a:2, d:"medium", n:"Büyük Okyanus." },
  { q:"İstiklal Marşı şairi?", o:["Mehmet Akif","Namık Kemal","Yahya Kemal","Orhan Veli","Can Yücel"], a:0, d:"easy", n:"Mehmet Akif Ersoy." },
  { q:"Güneş'e en yakın gezegen?", o:["Venüs","Dünya","Mars","Merkür","Jüpiter"], a:3, d:"medium", n:"Merkür." },
  { q:"Sayının kendisiyle çarpımı?", o:["Toplam","Fark","Bölüm","Kare","Küp"], a:3, d:"easy", n:"Kare." },
  { q:"En büyük göl?", o:["Van","Tuz","Beyşehir","Eğirdir","İznik"], a:0, d:"medium", n:"Van Gölü." },
  { q:"TBMM hangi savaştan sonra açıldı?", o:["I.Dünya","Kurtuluş","Çanakkale","Sakarya","Balkan"], a:1, d:"medium", n:"Kurtuluş Savaşı." },
  { q:"Maden olmayan?", o:["Demir","Bakır","Kömür","Petrol","Su"], a:4, d:"easy", n:"Su." },
  { q:"Yağış getiren bulut?", o:["Kümülüs","Sirüs","Nimbüs","Stratüs","Alto"], a:2, d:"hard", n:"Nimbüs." },
  { q:"Basınç birimi?", o:["Newton","Pascal","Joule","Watt","Volt"], a:1, d:"hard", n:"Pascal." },
  { q:"Haberleşme aracı olmayan?", o:["Telefon","Radyo","TV","Mektup","Kalem"], a:4, d:"easy", n:"Kalem." },
  { q:"Kızılay kurucusu?", o:["Dr. Abdullah Bey","Dr. Refik Saydam","Kerim Ağa","Hilal-i Ahmer","Mehmet Akif"], a:0, d:"medium", n:"Dr. Abdullah Bey." },
  { q:"En kalabalık kıta?", o:["Afrika","Asya","Avrupa","Amerika","Avustralya"], a:1, d:"easy", n:"Asya." },
  { q:"Atatürk'ün doğum yeri?", o:["İstanbul","Ankara","Selanik","Manastır","İzmir"], a:2, d:"easy", n:"Selanik." },
  { q:"Üçgen iç açı toplamı?", o:["90","180","270","360","100"], a:1, d:"easy", n:"180." }
];

let allQuestions = [];
let userData = {};
let examId = null;
let answers = [];
let answeredSet = new Set();
let timer = null;
let remaining = 1800;

// Başlangıçta soruları hemen yükle (login ekranında bile dolu olacak)
function pickRandomQuestions() {
  const shuffled = [...questionPool].sort(() => Math.random() - 0.5);
  allQuestions = shuffled.slice(0, 20);
}
pickRandomQuestions(); // hemen doldur

// Oturum
if (sessionStorage.getItem('examState')) {
  const state = JSON.parse(sessionStorage.getItem('examState'));
  if (state.screen) showScreen(state.screen);
  if (state.examId) examId = state.examId;
  if (state.userData) userData = state.userData;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('stickyBar').style.display = (id === 'examScreen') ? 'flex' : 'none';
  sessionStorage.setItem('examState', JSON.stringify({screen:id, examId, userData}));
}
function goHome() { showScreen('loginScreen'); }

// Giriş
document.getElementById('startBtn').addEventListener('click', async () => {
  const name = document.getElementById('nameInput').value.trim();
  const surname = document.getElementById('surnameInput').value.trim();
  const email = document.getElementById('emailInput').value.trim();
  const errDiv = document.getElementById('loginError'); errDiv.style.display='none';
  if (!name || !surname || !email.includes('@')) { errDiv.textContent='Tüm alanları doldurun.'; errDiv.style.display='block'; return; }
  try {
    const snap = await get(examsRef);
    if (Object.values(snap.val()||{}).some(e=>e.email===email)) { errDiv.textContent='Bu e-posta ile sınav girilmiş.'; errDiv.style.display='block'; return; }
  } catch(e) { errDiv.textContent='Bağlantı hatası.'; errDiv.style.display='block'; return; }
  userData = { name, surname, email };
  showScreen('examScreen');
  startExam();
});

function startExam() {
  pickRandomQuestions(); // yeni 20 soru
  answeredSet.clear();
  answers = new Array(allQuestions.length).fill('blank');
  remaining = 1800;
  document.getElementById('stickyTimer').textContent = '⏱️ 30:00';
  document.getElementById('stickyTotal').textContent = allQuestions.length;
  document.getElementById('stickyAnswered').textContent = '0';
  document.getElementById('stickyProgress').textContent = '0';
  renderExamQuestions();
  startTimer();
}
function startTimer() {
  clearInterval(timer);
  timer = setInterval(() => {
    remaining--;
    const m = Math.floor(remaining/60), s = remaining%60;
    document.getElementById('stickyTimer').textContent = `⏱️ ${m<10?'0'+m:m}:${s<10?'0'+s:s}`;
    if (remaining <= 0) { clearInterval(timer); finishExam(); }
  }, 1000);
}
function renderExamQuestions() {
  if (!allQuestions.length) {
    document.getElementById('questionsContainer').innerHTML = '<p style="color:var(--danger)">Sorular yüklenemedi, lütfen sayfayı yenileyin.</p>';
    return;
  }
  let html = '';
  allQuestions.forEach((q, i) => {
    html += `<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:12px"><strong>Soru ${i+1}:</strong> ${q.q}<div style="margin-top:12px;display:flex;flex-direction:column;gap:8px">`;
    q.o.forEach((opt, oi) => html += `<div class="opt" data-q="${i}" data-o="${oi}">${opt}</div>`);
    html += `<div class="opt blank-opt" data-q="${i}" data-o="blank">Boş bırak</div></div></div>`;
  });
  document.getElementById('questionsContainer').innerHTML = html;
  document.querySelectorAll('.opt').forEach(el => el.addEventListener('click', function() {
    const qIdx = +this.dataset.q, val = this.dataset.o;
    answers[qIdx] = val === 'blank' ? 'blank' : +val;
    answeredSet.add(qIdx);
    this.parentElement.querySelectorAll('.opt').forEach(o => o.classList.remove('chosen'));
    this.classList.add('chosen');
    document.getElementById('stickyAnswered').textContent = answeredSet.size;
    document.getElementById('stickyProgress').textContent = Math.round(answeredSet.size / allQuestions.length * 100);
  }));
}

// Yeni soru butonu
document.getElementById('refreshQuestionsBtn').addEventListener('click', () => {
  if (confirm('Yeni 20 soru getirilsin mi? Mevcut cevaplar silinecek.')) {
    pickRandomQuestions();
    answers = new Array(allQuestions.length).fill('blank');
    answeredSet.clear();
    document.getElementById('stickyAnswered').textContent = '0';
    document.getElementById('stickyProgress').textContent = '0';
    renderExamQuestions();
  }
});

// Sınavı bitir
document.getElementById('finishBtn').addEventListener('click', async function() {
  const btn = this; btn.disabled = true; btn.textContent = 'Gönderiliyor...';
  try {
    clearInterval(timer);
    let correct = 0, wrong = 0, empty = 0;
    const final = answers.map((v, i) => {
      if (v === 'blank') { empty++; return 'blank'; }
      if (v === allQuestions[i].a) { correct++; return v; }
      wrong++; return v;
    });
    const score = Math.round(correct / allQuestions.length * 100);
    const newRef = push(examsRef);
    examId = newRef.key;
    await set(newRef, { ...userData, score, correct, wrong, empty, answers: final, status: 'completed', revealed: false, submittedAt: Date.now() });
    showScreen('waitScreen');
    const link = location.origin + location.pathname + '?exam=' + examId;
    document.getElementById('linkBox').textContent = link;
    document.getElementById('linkBox').onclick = () => { navigator.clipboard.writeText(link); alert('Link kopyalandı!'); };
  } catch(e) { alert('Hata: ' + e.message); }
  finally { btn.disabled = false; btn.textContent = '✨ Sınavı Bitir ve Gönder'; }
});

function showResult(data) {
  showScreen('resultScreen');
  document.getElementById('scoreDisplay').textContent = data.score;
  document.getElementById('correctDisplay').textContent = data.correct;
  document.getElementById('wrongDisplay').textContent = data.wrong;
  document.getElementById('emptyDisplay').textContent = data.empty;
  document.getElementById('nameSurnameDisplay').textContent = `${data.name} ${data.surname} - ${data.email}`;
  let html = '';
  allQuestions.forEach((q, i) => {
    const ua = data.answers[i]; let color='#6b7280', status='⬜ Boş', choice='Seçilmedi';
    if (ua !== 'blank') { choice = q.o[ua]; color = ua === q.a ? '#10b981' : '#ef4444'; status = ua === q.a ? '✅ Doğru' : '❌ Yanlış'; }
    html += `<div style="border-left:4px solid ${color};padding:12px;margin:8px 0;background:var(--card);border-radius:10px"><b>Soru ${i+1}:</b> ${q.q}<br><b>Cevabın:</b> <span style="color:${color}">${choice}</span> (${status})<br><b>Doğru:</b> ${q.o[q.a]}<br><small>💡 ${q.n||''}</small></div>`;
  });
  document.getElementById('analysisContainer').innerHTML = html;
  confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
  const link = location.origin + location.pathname + '?exam=' + examId;
  document.getElementById('shareWhatsAppResult').onclick = () => window.open(`https://wa.me/?text=${encodeURIComponent('KPSS Sonucum: ' + link)}`);
  document.getElementById('sendMailResult').onclick = () => sendResultMail(data, link);
}

async function sendResultMail(data, link) {
  emailjs.init(MAIL_PUBLIC_KEY);
  try {
    await emailjs.send(MAIL_SERVICE_ID, MAIL_TEMPLATE_ID, {
      to_email: data.email,
      to_name: data.name + ' ' + data.surname,
      score: data.score,
      correct: data.correct,
      wrong: data.wrong,
      empty: data.empty,
      link: link
    });
    alert('✅ Mail gönderildi!');
  } catch(e) { alert('❌ Mail hatası: ' + e.message); }
}

// Diğer butonlar
document.getElementById('copyLinkBtn').addEventListener('click', ()=> navigator.clipboard.writeText(document.getElementById('linkBox').textContent).then(()=>alert('Kopyalandı!')));
document.getElementById('shareWhatsAppBtn').addEventListener('click', ()=> window.open(`https://wa.me/?text=${encodeURIComponent('KPSS linkim: ' + document.getElementById('linkBox').textContent)}`));
document.getElementById('checkBtn').addEventListener('click', async ()=>{
  if (!examId) return;
  const snap = await get(ref(db, `exams/${examId}`));
  const d = snap.val();
  if (d?.revealed) showResult(d); else alert('Henüz yayınlanmadı.');
});
onValue(ref(db, `exams/${examId}`), snap => {
  const d = snap.val();
  if (d?.revealed && document.getElementById('waitScreen').classList.contains('active')) showResult(d);
});

// URL'den sonuç
const urlParams = new URLSearchParams(location.search);
if (urlParams.get('exam')) {
  get(ref(db, `exams/${urlParams.get('exam')}`)).then(snap => {
    const d = snap.val();
    if (d?.revealed) { userData = { name: d.name, surname: d.surname, email: d.email }; showResult(d); }
    else document.getElementById('loginScreen').innerHTML = '<h2>Sonuç henüz yayınlanmadı.</h2>';
  });
}

// Yönetici modal
const adminModal = document.getElementById('adminModal');
document.getElementById('openAdminBtn').addEventListener('click', ()=>{
  adminModal.classList.add('active');
  document.getElementById('adminLoginForm').style.display='block';
  document.getElementById('adminMain').style.display='none';
});
document.getElementById('closeAdminModal').addEventListener('click', ()=> adminModal.classList.remove('active'));

let adminExams={}, selectedExamId=null;
document.getElementById('adminLoginBtn').addEventListener('click', ()=>{
  if (document.getElementById('adminPass').value.trim()===ADMIN_PASSWORD) {
    document.getElementById('adminLoginForm').style.display='none';
    document.getElementById('adminMain').style.display='block';
    initAdminPanel();
  }
});

function initAdminPanel() {
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click', function() {
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    this.classList.add('active');
    document.getElementById('examsTab').style.display = this.dataset.tab==='exams'?'block':'none';
    document.getElementById('questionsTab').style.display = this.dataset.tab==='questions'?'block':'none';
  }));
  onValue(examsRef, snap => { adminExams=snap.val()||{}; renderExamList(); document.getElementById('totalExams').textContent=Object.keys(adminExams).length; });
}

function renderExamList() {
  const list=document.getElementById('examList');
  const ids=Object.keys(adminExams);
  if (!ids.length) { list.innerHTML='<p>Henüz sınav yok.</p>'; return; }
  let html='';
  ids.sort((a,b)=>adminExams[b].submittedAt-adminExams[a].submittedAt).forEach(id => {
    const e=adminExams[id];
    html+=`<div class="list-item" data-id="${id}"><div><strong>${e.name} ${e.surname}</strong><br><small>${e.email}</small></div><div style="text-align:right"><span style="color:var(--accent);font-weight:700">${e.score}p</span><br>${e.revealed?'✅':'🔒'}</div></div>`;
  });
  list.innerHTML=html;
  document.querySelectorAll('#examList .list-item').forEach(el=>el.addEventListener('click', function() {
    document.querySelectorAll('#examList .list-item').forEach(i=>i.classList.remove('selected'));
    this.classList.add('selected'); selectedExamId=this.dataset.id;
    showExamDetail(selectedExamId); document.getElementById('adminActions').style.display='flex';
  }));
}
function showExamDetail(id) {
  const e=adminExams[id];
  let html=`<b>${e.name} ${e.surname}</b> (${e.email})<br>Puan: ${e.score} | ✅${e.correct} ❌${e.wrong} ⬜${e.empty}<br>`;
  allQuestions.forEach((q,i)=>{
    const ua=e.answers[i]; const txt=ua==='blank'?'Boş':q.o[ua]; const ok=ua!=='blank'&&ua===q.a;
    html+=`<div style="color:${ok?'#10b981':(ua==='blank'?'gray':'#ef4444')}">${i+1}. ${txt} ${ua==='blank'?'':(ok?'✓':'✗')}</div>`;
  });
  document.getElementById('detailPanel').innerHTML=html; document.getElementById('detailPanel').style.display='block';
}

document.getElementById('yayinlaBtn').addEventListener('click', async ()=>{
  if (!selectedExamId) return;
  await update(ref(db, `exams/${selectedExamId}`), { revealed: true });
  const exam = adminExams[selectedExamId];
  emailjs.init(MAIL_PUBLIC_KEY);
  emailjs.send(MAIL_SERVICE_ID, MAIL_TEMPLATE_ID, {
    to_email: exam.email,
    to_name: exam.name+' '+exam.surname,
    score: exam.score,
    correct: exam.correct,
    wrong: exam.wrong,
    empty: exam.empty,
    link: location.origin+location.pathname+'?exam='+selectedExamId
  }).then(()=> alert('✅ Yayınlandı ve mail gönderildi!'))
    .catch(()=> alert('✅ Yayınlandı, mail hatası.'));
});
document.getElementById('kilitleBtn').addEventListener('click', async ()=>{ if(selectedExamId) await update(ref(db,`exams/${selectedExamId}`),{revealed:false}); });

// Soru bankası
function renderQuestionBankFromData(data) {
  const arr = Object.entries(data).map(([id, val]) => ({ id, ...val }));
  let html = '';
  arr.forEach(q => {
    html += `<div class="list-item"><span>${q.q} <span class="tag ${q.difficulty}">${q.difficulty==='easy'?'Kolay':q.difficulty==='medium'?'Orta':'Zor'}</span></span>
      <div><button class="btn-sm edit-q" data-id="${q.id}" style="background:var(--info)">✏️</button>
      <button class="btn-sm del-q" data-id="${q.id}" style="background:var(--danger)">🗑️</button></div></div>`;
  });
  document.getElementById('questionList').innerHTML = html || '<p>Henüz soru yok.</p>';
  document.querySelectorAll('.edit-q').forEach(b => b.addEventListener('click', () => editQuestion(b.dataset.id)));
  document.querySelectorAll('.del-q').forEach(b => b.addEventListener('click', () => deleteQuestion(b.dataset.id)));
}
onValue(questionsRef, snap => renderQuestionBankFromData(snap.val()||{}));

document.getElementById('addQuestionBtn').addEventListener('click', ()=>{
  const q=prompt('Soru:'); if(!q) return;
  const opts=[]; for(let i=0;i<5;i++) { const o=prompt(String.fromCharCode(65+i)+')'); if(!o) return; opts.push(o); }
  const a=prompt('Doğru (0-4):'); if(a===null||isNaN(+a)) return;
  const d=prompt('Zorluk (easy/medium/hard):','easy'); if(!['easy','medium','hard'].includes(d)) return;
  const n=prompt('Not:')||'';
  push(questionsRef,{q,o:opts,a:+a,difficulty:d,n});
});

function editQuestion(id) {
  get(questionsRef).then(snap => {
    const questions = snap.val()||{};
    const entry = Object.entries(questions).find(([key])=>key===id);
    if(!entry) return;
    const data = entry[1];
    const nq=prompt('Soru:',data.q); if(!nq) return;
    const opts=[]; for(let i=0;i<5;i++) { const o=prompt(String.fromCharCode(65+i)+':',data.o[i]); if(!o) return; opts.push(o); }
    const a=prompt('Doğru (0-4):',data.a); if(a===null||isNaN(+a)) return;
    const d=prompt('Zorluk:',data.difficulty); if(!['easy','medium','hard'].includes(d)) return;
    const n=prompt('Not:',data.n||'')||'';
    update(ref(db,`questions/${id}`),{q:nq,o:opts,a:+a,difficulty:d,n});
  });
}
function deleteQuestion(id) { if(confirm('Silinsin mi?')) remove(ref(db,`questions/${id}`)); }

document.getElementById('backToHomeBtn').addEventListener('click', goHome);
document.getElementById('backToHomeWaitBtn').addEventListener('click', goHome);
document.getElementById('backToHomeResultBtn').addEventListener('click', goHome);
</script>

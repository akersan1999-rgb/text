<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KPSS Deneme Sınavı 🎯</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans',sans-serif }
        body { background:#0f0b19; color:#f1f5f9; min-height:100vh; display:flex; justify-content:center; padding:20px; }
        .container { max-width:750px; width:100% }

        .screen { display:none; background:linear-gradient(145deg,#19132e,#22183e); border-radius:28px; padding:35px 25px; border:1px solid #3c244f; margin-bottom:20px }
        .screen.active { display:block }

        h2 { color:#fff; margin-bottom:20px; text-align:center; font-weight:800; font-size:1.8rem }
        input, button { width:100%; padding:14px; border-radius:12px; margin-bottom:12px; border:2px solid #3c244f; background:#0f0b19; color:#fff; font-size:1rem; outline:none }
        button { background:linear-gradient(135deg,#f43f5e,#ec4899); border:none; font-weight:700; cursor:pointer; font-size:1.1rem }
        button:hover { opacity:0.9 }
        button:disabled { opacity:0.5; cursor:not-allowed }

        .row { display:flex; gap:10px }
        .row>* { flex:1 }

        .timer { background:rgba(244,63,94,0.15); padding:15px; border-radius:14px; text-align:center; margin-bottom:20px; font-weight:700; font-size:1.3rem }
        .stats-grid { display:flex; justify-content:space-around; background:rgba(0,0,0,0.3); padding:15px; border-radius:14px; margin-bottom:20px; text-align:center }
        .stats-item span { display:block; font-size:2rem; font-weight:800; color:#f43f5e }

        .opt { padding:12px; border:2px solid #3c244f; border-radius:10px; cursor:pointer; display:flex; align-items:center; gap:10px; margin-bottom:8px; background:rgba(15,11,25,0.4) }
        .opt:hover { border-color:#f43f5e }
        .opt.chosen { border-color:#f43f5e; background:rgba(244,63,94,0.12) }
        .opt.chosen::before { content:'✓'; color:#f43f5e; font-weight:bold; font-size:1.2rem }
        .blank-opt { border-style:dashed }

        .link-box { background:#0f0b19; border:1px dashed #f43f5e; padding:10px; border-radius:8px; text-align:center; color:#f43f5e; margin:15px 0; word-break:break-all; cursor:pointer }

        /* Modal */
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:999; justify-content:center; align-items:center }
        .modal.active { display:flex }
        .modal-content { background:#1e1635; padding:30px; border-radius:20px; width:90%; max-width:500px; border:1px solid #f43f5e; max-height:80vh; overflow-y:auto }
        .close-modal { float:right; font-size:1.5rem; cursor:pointer; color:#cbd5e1 }
        .list-item { padding:12px; border-bottom:1px solid #3c244f; cursor:pointer; display:flex; justify-content:space-between }
        .list-item:hover { background:rgba(244,63,94,0.08) }
        .list-item.selected { background:rgba(244,63,94,0.15); border-left:4px solid #f43f5e }
        .detail-box { background:rgba(0,0,0,0.3); padding:15px; border-radius:12px; margin-top:15px; max-height:200px; overflow-y:auto }
        .tabs { display:flex; gap:5px; margin-bottom:15px }
        .tab { padding:8px 16px; background:#19132e; border-radius:10px; cursor:pointer; color:#cbd5e1; border:1px solid #3c244f; font-size:0.9rem }
        .tab.active { background:#f43f5e; color:#fff; border-color:#f43f5e }
        .btn-sm { padding:8px 15px; font-size:0.85rem; width:auto }
        .tag { display:inline-block; padding:3px 8px; border-radius:20px; font-size:0.7rem; font-weight:600 }
        .easy { background:#10b98133; color:#10b981 } .medium { background:#f59e0b33; color:#f59e0b } .hard { background:#ef444433; color:#ef4444 }

        .error-msg { color:#f43f5e; text-align:center; margin-bottom:10px; background:rgba(244,63,94,0.1); padding:10px; border-radius:8px }
        .admin-btn { position:fixed; bottom:20px; right:20px; width:50px; height:50px; border-radius:50%; background:#f43f5e; color:#fff; border:none; font-size:1.5rem; cursor:pointer; box-shadow:0 5px 15px rgba(0,0,0,0.5); z-index:99 }
    </style>
</head>
<body>
<div class="container">
    <!-- Giriş Ekranı -->
    <div class="screen active" id="loginScreen">
        <h2>🎯 KPSS Deneme Sınavı</h2>
        <p style="text-align:center; margin-bottom:20px; color:#cbd5e1">Ad, soyad ve e-posta ile giriş yap. Tek hakkın var!</p>
        <div id="loginError" class="error-msg" style="display:none"></div>
        <div class="row">
            <input type="text" id="nameInput" placeholder="Adın" />
            <input type="text" id="surnameInput" placeholder="Soyadın" />
        </div>
        <input type="email" id="emailInput" placeholder="E-posta adresin" />
        <button id="startBtn">Sınava Başla 🚀</button>
    </div>

    <!-- Sınav Ekranı -->
    <div class="screen" id="examScreen">
        <div class="timer" id="timerDisplay">⏱️ 30:00</div>
        <div class="row" style="margin-bottom:15px">
            <span>Cevaplanan: <span id="answeredCount">0</span>/<span id="totalQ">20</span></span>
            <span><span id="progressPercent">0</span>%</span>
        </div>
        <div id="questionsContainer"></div>
        <button id="finishBtn">Sınavı Bitir ve Gönder ✨</button>
    </div>

    <!-- Bekleme Ekranı -->
    <div class="screen" id="waitScreen">
        <h2>⏳ Sınavın Kaydedildi</h2>
        <p style="text-align:center; margin-bottom:15px">Sonuç linkini kopyala, yönetici yayınlayınca görebilirsin.</p>
        <div class="link-box" id="linkBox"></div>
        <button id="checkBtn">📊 Sonuçlarımı Gör</button>
    </div>

    <!-- Sonuç Ekranı -->
    <div class="screen" id="resultScreen">
        <div class="stats-grid">
            <div class="stats-item"><span id="scoreDisplay">0</span>Puan</div>
            <div class="stats-item"><span id="correctDisplay">0</span>Doğru</div>
            <div class="stats-item"><span id="wrongDisplay">0</span>Yanlış</div>
            <div class="stats-item"><span id="emptyDisplay">0</span>Boş</div>
        </div>
        <p style="text-align:center; margin-bottom:20px" id="nameSurnameDisplay"></p>
        <div id="analysisContainer"></div>
        <button id="pdfDownloadBtn" style="background:#6366f1; margin-top:15px">📥 PDF İndir</button>
    </div>
</div>

<!-- Yönetici Modal -->
<div class="modal" id="adminModal">
    <div class="modal-content">
        <span class="close-modal" id="closeAdminModal">&times;</span>
        <h3 style="color:#f43f5e; margin-bottom:15px">🔐 Yönetici Girişi</h3>
        <div id="adminLoginForm">
            <input type="password" id="adminPass" placeholder="Şifre" />
            <button id="adminLoginBtn">Giriş</button>
            <div id="adminError" class="error-msg" style="display:none"></div>
        </div>
        <div id="adminMain" style="display:none">
            <div class="tabs">
                <div class="tab active" data-tab="exams">📋 Sınav Listesi</div>
                <div class="tab" data-tab="questions">📚 Soru Bankası</div>
            </div>
            <div id="examsTab">
                <p style="margin:10px 0"><span id="totalExams">0</span> sınav kaydı</p>
                <div id="examList" style="max-height:250px; overflow-y:auto; background:rgba(0,0,0,0.2); border-radius:10px; padding:5px"></div>
                <div class="detail-box" id="detailPanel" style="display:none"></div>
                <div id="adminActions" style="display:none; margin-top:10px; display:flex; gap:10px">
                    <button id="yayinlaBtn" style="background:#10b981">✅ Yayınla</button>
                    <button id="kilitleBtn" style="background:#f59e0b">🔒 Kilitle</button>
                    <button id="silBtn" style="background:#ef4444">🗑️ Tümünü Sil</button>
                </div>
                <p id="adminMsg" style="color:#fbbf24; text-align:center; margin-top:10px"></p>
            </div>
            <div id="questionsTab" style="display:none">
                <button id="addQuestionBtn" style="background:#10b981; margin-bottom:10px">➕ Yeni Soru Ekle</button>
                <div id="questionList" style="max-height:400px; overflow-y:auto"></div>
            </div>
        </div>
    </div>
</div>

<!-- Yönetici butonu (sadece giriş ekranında görünür) -->
<button class="admin-btn" id="openAdminBtn" title="Yönetici Paneli">⚙️</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, push, set, onValue, update, get, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyCuj-l1GPAWz4wFrP209LCY2B_zr2_m8dg",
    authDomain: "test-ba1a3.firebaseapp.com",
    databaseURL: "https://test-ba1a3-default-rtdb.europe-west1.firebasedatabase.app/",
    projectId: "test-ba1a3",
    storageBucket: "test-ba1a3.firebasestorage.app",
    messagingSenderId: "413174140566",
    appId: "1:413174140566:web:f7eefa4717579784b3bcb7"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const examsRef = ref(db, 'exams');
const questionsRef = ref(db, 'questions');

const ADMIN_PASSWORD = "1923";

const defaultQuestions = [
    { q:"Türkiye'nin en kalabalık şehri?", o:["Ankara","İstanbul","İzmir","Bursa","Antalya"], a:1, difficulty:"easy", n:"İstanbul." },
    { q:"TBMM açılış tarihi?", o:["23 Nisan 1920","29 Ekim 1923","19 Mayıs 1919","30 Ağustos 1922","15 Temmuz 2016"], a:0, difficulty:"easy", n:"23 Nisan 1920." },
    { q:"Doğal afet olmayan?", o:["Deprem","Sel","Çığ","Trafik kazası","Heyelan"], a:3, difficulty:"easy", n:"İnsan kaynaklı." },
    { q:"Su buharının sıvıya dönüşmesi?", o:["Buharlaşma","Yoğuşma","Süblimleşme","Erime","Donma"], a:1, difficulty:"medium", n:"Yoğuşma." },
    { q:"İstanbul'u fetheden padişah?", o:["Fatih","Kanuni","Yavuz","II.Mahmut","Abdülmecid"], a:0, difficulty:"easy", n:"Fatih Sultan Mehmet." },
    { q:"En uzun akarsu?", o:["Fırat","Dicle","Kızılırmak","Sakarya","Yeşilırmak"], a:2, difficulty:"medium", n:"Kızılırmak." },
    { q:"Cumhuriyet ilan yılı?", o:["1920","1921","1922","1923","1924"], a:3, difficulty:"easy", n:"1923." },
    { q:"Almanya başkenti?", o:["Paris","Berlin","Londra","Roma","Madrid"], a:1, difficulty:"medium", n:"Berlin." },
    { q:"Çift ünlü içeren kelime?", o:["Türk","Aile","Kalem","Kitap","Defter"], a:1, difficulty:"medium", n:"Aile." },
    { q:"1 m = ? cm", o:["10","100","1000","10000","100000"], a:1, difficulty:"easy", n:"100 cm." },
    { q:"En büyük okyanus?", o:["Atlas","Hint","Pasifik","Arktik","Güney"], a:2, difficulty:"medium", n:"Büyük Okyanus." },
    { q:"İstiklal Marşı şairi?", o:["Mehmet Akif","Namık Kemal","Yahya Kemal","Orhan Veli","Can Yücel"], a:0, difficulty:"easy", n:"Mehmet Akif Ersoy." },
    { q:"Güneş'e en yakın gezegen?", o:["Venüs","Dünya","Mars","Merkür","Jüpiter"], a:3, difficulty:"medium", n:"Merkür." },
    { q:"Sayının kendisiyle çarpımı?", o:["Toplam","Fark","Bölüm","Kare","Küp"], a:3, difficulty:"easy", n:"Kare." },
    { q:"En büyük göl?", o:["Van","Tuz","Beyşehir","Eğirdir","İznik"], a:0, difficulty:"medium", n:"Van Gölü." },
    { q:"TBMM hangi savaştan sonra açıldı?", o:["I.Dünya","Kurtuluş","Çanakkale","Sakarya","Balkan"], a:1, difficulty:"medium", n:"Kurtuluş Savaşı." },
    { q:"Maden olmayan?", o:["Demir","Bakır","Kömür","Petrol","Su"], a:4, difficulty:"easy", n:"Su." },
    { q:"Yağış getiren bulut?", o:["Kümülüs","Sirüs","Nimbüs","Stratüs","Alto"], a:2, difficulty:"hard", n:"Nimbüs." },
    { q:"Basınç birimi?", o:["Newton","Pascal","Joule","Watt","Volt"], a:1, difficulty:"hard", n:"Pascal." },
    { q:"Haberleşme aracı olmayan?", o:["Telefon","Radyo","TV","Mektup","Kalem"], a:4, difficulty:"easy", n:"Kalem." }
];

let allQuestions = [];
let userData = {};
let examId = null;
let answers = [];
let answeredSet = new Set();
let timer = null;
let remaining = 1800;

// ========== SORU BANKASI YÜKLEME ==========
async function initQuestions() {
    try {
        const snap = await get(questionsRef);
        if (!snap.exists()) {
            for (const q of defaultQuestions) {
                await push(questionsRef, q);
            }
        }
    } catch(e) {
        console.error("Soru yükleme hatası:", e);
    }
    onValue(questionsRef, (snap) => {
        const data = snap.val() || {};
        const arr = Object.entries(data).map(([id, val]) => ({ id, ...val }));
        allQuestions = arr.sort(() => Math.random() - 0.5).slice(0, 20);
        renderQuestionBank();
    });
}
initQuestions();

// ========== EKRAN GEÇİŞİ ==========
function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

// ========== SINAV BAŞLAT ==========
document.getElementById('startBtn').addEventListener('click', async () => {
    const name = document.getElementById('nameInput').value.trim();
    const surname = document.getElementById('surnameInput').value.trim();
    const email = document.getElementById('emailInput').value.trim();
    const errDiv = document.getElementById('loginError');
    errDiv.style.display = 'none';

    if (!name || !surname || !email.includes('@')) {
        errDiv.textContent = 'Lütfen tüm alanları doğru doldurun.';
        errDiv.style.display = 'block';
        return;
    }

    try {
        const snap = await get(examsRef);
        const exams = snap.val() || {};
        if (Object.values(exams).some(e => e.email === email)) {
            errDiv.textContent = 'Bu e-posta ile zaten sınav girilmiş.';
            errDiv.style.display = 'block';
            return;
        }
    } catch(e) {
        errDiv.textContent = 'Bağlantı hatası, sayfayı yenileyin.';
        errDiv.style.display = 'block';
        return;
    }

    if (allQuestions.length === 0) {
        errDiv.textContent = 'Sorular henüz yüklenmedi, lütfen biraz bekleyin.';
        errDiv.style.display = 'block';
        return;
    }

    userData = { name, surname, email };
    showScreen('examScreen');
    startExam();
});

function startExam() {
    answeredSet.clear();
    answers = new Array(allQuestions.length).fill('blank');
    remaining = 1800;
    document.getElementById('timerDisplay').textContent = '⏱️ 30:00';
    document.getElementById('totalQ').textContent = allQuestions.length;
    document.getElementById('answeredCount').textContent = '0';
    document.getElementById('progressPercent').textContent = '0';
    renderExamQuestions();
    startTimer();
}

function startTimer() {
    clearInterval(timer);
    timer = setInterval(() => {
        remaining--;
        const m = Math.floor(remaining/60), s = remaining%60;
        document.getElementById('timerDisplay').textContent = `⏱️ ${m<10?'0'+m:m}:${s<10?'0'+s:s}`;
        if (remaining <= 0) { clearInterval(timer); finishExam(); }
    }, 1000);
}

function renderExamQuestions() {
    let html = '';
    allQuestions.forEach((q, i) => {
        html += `<div style="background:#19132e; border:1px solid #3c244f; border-radius:16px; padding:18px; margin-bottom:12px">
            <strong>Soru ${i+1}:</strong> ${q.q}
            <div style="margin-top:12px; display:flex; flex-direction:column; gap:8px">`;
        q.o.forEach((opt, oi) => {
            html += `<div class="opt" data-q="${i}" data-o="${oi}">${opt}</div>`;
        });
        html += `<div class="opt blank-opt" data-q="${i}" data-o="blank">Boş bırak</div></div></div>`;
    });
    document.getElementById('questionsContainer').innerHTML = html;

    document.querySelectorAll('.opt').forEach(el => {
        el.addEventListener('click', function() {
            const qIdx = +this.dataset.q;
            const val = this.dataset.o;
            answers[qIdx] = val === 'blank' ? 'blank' : +val;
            answeredSet.add(qIdx);
            const parent = this.parentElement;
            parent.querySelectorAll('.opt').forEach(o => o.classList.remove('chosen'));
            this.classList.add('chosen');
            document.getElementById('answeredCount').textContent = answeredSet.size;
            document.getElementById('progressPercent').textContent = Math.round(answeredSet.size/allQuestions.length*100);
        });
    });
}

// ========== SINAVI BİTİR (GÖNDER) ==========
document.getElementById('finishBtn').addEventListener('click', async function() {
    const btn = this;
    btn.disabled = true;
    btn.textContent = 'Gönderiliyor...';

    try {
        clearInterval(timer);

        let correct = 0, wrong = 0, empty = 0;
        const finalAnswers = answers.map((val, i) => {
            if (val === 'blank') { empty++; return 'blank'; }
            if (val === allQuestions[i].a) { correct++; return val; }
            wrong++; return val;
        });

        const score = Math.round(correct / allQuestions.length * 100);

        const newRef = push(examsRef);
        examId = newRef.key;

        await set(newRef, {
            name: userData.name,
            surname: userData.surname,
            email: userData.email,
            score: score,
            correct: correct,
            wrong: wrong,
            empty: empty,
            answers: finalAnswers,
            status: 'completed',
            revealed: false,
            submittedAt: Date.now()
        });

        showScreen('waitScreen');
        const link = location.origin + location.pathname + '?exam=' + examId;
        document.getElementById('linkBox').textContent = link;
        document.getElementById('linkBox').onclick = () => {
            navigator.clipboard.writeText(link);
            alert('Link kopyalandı!');
        };

    } catch(e) {
        console.error('Gönderme hatası:', e);
        alert('Hata oluştu: ' + e.message + '\n\nLütfen internet bağlantınızı kontrol edip sayfayı yenileyin.');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Sınavı Bitir ve Gönder ✨';
    }
});

// ========== SONUÇ GÖRÜNTÜLEME ==========
function showResult(data) {
    showScreen('resultScreen');
    document.getElementById('scoreDisplay').textContent = data.score;
    document.getElementById('correctDisplay').textContent = data.correct;
    document.getElementById('wrongDisplay').textContent = data.wrong;
    document.getElementById('emptyDisplay').textContent = data.empty;
    document.getElementById('nameSurnameDisplay').textContent = data.name + ' ' + data.surname + ' - ' + data.email;

    let html = '';
    allQuestions.forEach((q, i) => {
        const ua = data.answers[i];
        let color = '#6b7280', status = '⬜ Boş', choice = 'Seçilmedi';
        if (ua !== 'blank') {
            choice = q.o[ua];
            if (ua === q.a) { color = '#10b981'; status = '✅ Doğru'; }
            else { color = '#ef4444'; status = '❌ Yanlış'; }
        }
        html += `<div style="border-left:4px solid ${color}; padding:10px; margin:8px 0; background:#19132e; border-radius:8px">
            <b>Soru ${i+1}:</b> ${q.q}<br>
            <b>Cevabın:</b> <span style="color:${color}">${choice}</span> (${status})<br>
            <b>Doğru Cevap:</b> ${q.o[q.a]}<br>
            <small>💡 ${q.n||''}</small>
        </div>`;
    });
    document.getElementById('analysisContainer').innerHTML = html;
}

// URL'den sonuç
const urlParams = new URLSearchParams(location.search);
const urlExamId = urlParams.get('exam');
if (urlExamId) {
    get(ref(db, `exams/${urlExamId}`)).then(snap => {
        const d = snap.val();
        if (d && d.revealed) {
            userData = { name:d.name, surname:d.surname, email:d.email };
            showResult(d);
        } else {
            document.getElementById('loginScreen').innerHTML = '<h2 style="text-align:center; margin-top:50px">Sonuç henüz yayınlanmadı.</h2>';
        }
    });
}

document.getElementById('checkBtn').addEventListener('click', async () => {
    if (!examId) return;
    const snap = await get(ref(db, `exams/${examId}`));
    const d = snap.val();
    if (d && d.revealed) showResult(d);
    else alert('Sonuç henüz yayınlanmadı.');
});

onValue(ref(db, `exams/${examId}`), snap => {
    const d = snap.val();
    if (d && d.revealed && document.getElementById('waitScreen').classList.contains('active')) {
        showResult(d);
    }
});

// PDF indirme
document.getElementById('pdfDownloadBtn').addEventListener('click', () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(16);
    doc.text('KPSS Deneme Sınavı Sonucu', 20, 20);
    doc.setFontSize(12);
    doc.text(`Ad Soyad: ${userData.name} ${userData.surname}`, 20, 35);
    doc.text(`E-posta: ${userData.email}`, 20, 45);
    doc.text(`Puan: ${document.getElementById('scoreDisplay').textContent}`, 20, 55);
    doc.text(`Doğru: ${document.getElementById('correctDisplay').textContent} | Yanlış: ${document.getElementById('wrongDisplay').textContent} | Boş: ${document.getElementById('emptyDisplay').textContent}`, 20, 65);
    doc.save('sinav_sonucu.pdf');
});

// ========== YÖNETİCİ PANELİ (MODAL) ==========
const adminModal = document.getElementById('adminModal');
const openAdminBtn = document.getElementById('openAdminBtn');
const closeAdminModal = document.getElementById('closeAdminModal');

openAdminBtn.addEventListener('click', () => {
    adminModal.classList.add('active');
    document.getElementById('adminLoginForm').style.display = 'block';
    document.getElementById('adminMain').style.display = 'none';
    document.getElementById('adminPass').value = '';
});

closeAdminModal.addEventListener('click', () => {
    adminModal.classList.remove('active');
});

let adminExams = {};
let selectedExamId = null;

document.getElementById('adminLoginBtn').addEventListener('click', () => {
    if (document.getElementById('adminPass').value.trim() === ADMIN_PASSWORD) {
        document.getElementById('adminLoginForm').style.display = 'none';
        document.getElementById('adminMain').style.display = 'block';
        document.getElementById('adminError').style.display = 'none';
        initAdminPanel();
    } else {
        document.getElementById('adminError').textContent = 'Şifre yanlış!';
        document.getElementById('adminError').style.display = 'block';
    }
});

function initAdminPanel() {
    // Sekme geçişleri
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', function() {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            const tabName = this.dataset.tab;
            document.getElementById('examsTab').style.display = tabName === 'exams' ? 'block' : 'none';
            document.getElementById('questionsTab').style.display = tabName === 'questions' ? 'block' : 'none';
        });
    });

    onValue(examsRef, snap => {
        adminExams = snap.val() || {};
        renderExamList();
        document.getElementById('totalExams').textContent = Object.keys(adminExams).length;
    });
}

function renderExamList() {
    const list = document.getElementById('examList');
    const ids = Object.keys(adminExams);
    if (!ids.length) { list.innerHTML = '<p style="padding:10px;text-align:center">Henüz sınav yok.</p>'; return; }
    let html = '';
    ids.sort((a,b) => adminExams[b].submittedAt - adminExams[a].submittedAt).forEach(id => {
        const e = adminExams[id];
        html += `<div class="list-item" data-id="${id}">
            <div><strong>${e.name} ${e.surname}</strong><br><small>${e.email}</small></div>
            <div style="text-align:right"><span style="color:#f43f5e;font-weight:700">${e.score}p</span><br>${e.revealed?'✅':'🔒'}</div>
        </div>`;
    });
    list.innerHTML = html;
    document.querySelectorAll('#examList .list-item').forEach(el => {
        el.addEventListener('click', function() {
            document.querySelectorAll('#examList .list-item').forEach(i => i.classList.remove('selected'));
            this.classList.add('selected');
            selectedExamId = this.dataset.id;
            showExamDetail(selectedExamId);
            document.getElementById('adminActions').style.display = 'flex';
        });
    });
}

function showExamDetail(id) {
    const e = adminExams[id];
    let html = `<b>${e.name} ${e.surname}</b> (${e.email})<br>Puan: ${e.score} | ✅${e.correct} ❌${e.wrong} ⬜${e.empty}<br><small>${new Date(e.submittedAt).toLocaleString()}</small><hr>`;
    allQuestions.forEach((q,i) => {
        const ua = e.answers[i];
        const txt = ua==='blank'?'Boş':q.o[ua];
        const ok = ua!=='blank' && ua===q.a;
        html += `<div style="font-size:0.85rem; color:${ok?'#10b981':(ua==='blank'?'gray':'#ef4444')}">${i+1}. ${txt} ${ua==='blank'?'':(ok?'✓':'✗')}</div>`;
    });
    document.getElementById('detailPanel').innerHTML = html;
    document.getElementById('detailPanel').style.display = 'block';
}

document.getElementById('yayinlaBtn').addEventListener('click', async () => {
    if (!selectedExamId) return;
    await update(ref(db, `exams/${selectedExamId}`), { revealed: true });
    document.getElementById('adminMsg').textContent = '✅ Yayınlandı.';
});
document.getElementById('kilitleBtn').addEventListener('click', async () => {
    if (!selectedExamId) return;
    await update(ref(db, `exams/${selectedExamId}`), { revealed: false });
    document.getElementById('adminMsg').textContent = '🔒 Kilitlendi.';
});
document.getElementById('silBtn').addEventListener('click', () => {
    if (confirm('TÜM SINAV KAYITLARI SİLİNECEK!')) {
        set(examsRef, null).then(() => {
            document.getElementById('adminMsg').textContent = '🗑️ Silindi, sayfa yenileniyor...';
            setTimeout(() => location.reload(), 1500);
        });
    }
});

// ========== SORU BANKASI YÖNETİMİ ==========
function renderQuestionBank() {
    const list = document.getElementById('questionList');
    if (!list) return;
    let html = '';
    allQuestions.forEach(q => {
        const diffLabel = { easy:'Kolay', medium:'Orta', hard:'Zor' }[q.difficulty] || q.difficulty;
        html += `<div class="list-item">
            <span>${q.q} <span class="tag ${q.difficulty}">${diffLabel}</span></span>
            <div>
                <button class="btn-sm edit-q" data-id="${q.id}" style="background:#6366f1">✏️</button>
                <button class="btn-sm del-q" data-id="${q.id}" style="background:#ef4444">🗑️</button>
            </div>
        </div>`;
    });
    list.innerHTML = html || '<p style="padding:10px;text-align:center">Henüz soru yok.</p>';

    document.querySelectorAll('.edit-q').forEach(b => {
        b.addEventListener('click', () => editQuestion(b.dataset.id));
    });
    document.querySelectorAll('.del-q').forEach(b => {
        b.addEventListener('click', () => deleteQuestion(b.dataset.id));
    });
}

document.getElementById('addQuestionBtn').addEventListener('click', () => {
    const q = prompt('Soru metni:');
    if (!q) return;
    const opts = [];
    for (let i=0; i<5; i++) {
        const o = prompt(String.fromCharCode(65+i) + ' seçeneği:');
        if (!o) return;
        opts.push(o);
    }
    const a = prompt('Doğru cevap (0=A, 1=B, 2=C, 3=D, 4=E):');
    if (a===null || isNaN(+a) || +a<0 || +a>4) return;
    const d = prompt('Zorluk (easy, medium, hard):', 'easy');
    if (!['easy','medium','hard'].includes(d)) return;
    const n = prompt('Açıklama notu:') || '';
    push(questionsRef, { q, o:opts, a:+a, difficulty:d, n });
});

function editQuestion(id) {
    const q = allQuestions.find(q => q.id === id);
    if (!q) return;
    const newQ = prompt('Soru:', q.q);
    if (!newQ) return;
    const opts = [];
    for (let i=0; i<5; i++) {
        const o = prompt(String.fromCharCode(65+i) + ':', q.o[i]);
        if (!o) return;
        opts.push(o);
    }
    const a = prompt('Doğru cevap (0-4):', q.a);
    if (a===null || isNaN(+a)) return;
    const d = prompt('Zorluk:', q.difficulty);
    if (!['easy','medium','hard'].includes(d)) return;
    const n = prompt('Not:', q.n||'') || '';
    update(ref(db, `questions/${id}`), { q:newQ, o:opts, a:+a, difficulty:d, n });
}

function deleteQuestion(id) {
    if (confirm('Bu soru silinsin mi?')) {
        remove(ref(db, `questions/${id}`));
    }
}
</script>

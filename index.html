<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 KPSS Deneme Sınavı</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ===== RESET & TEMA ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    body {
      background: #0b0f19;
      color: #f1f5f9;
      padding: 20px 10px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      background-image: radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(245, 158, 11, 0.06) 0%, transparent 50%);
      background-attachment: fixed;
    }
    .wrapper {
      max-width: 720px;
      width: 100%;
    }

    /* ===== HEADER ===== */
    .header {
      text-align: center;
      padding: 30px 20px;
      background: linear-gradient(145deg, #131c2e, #18243e);
      border-radius: 28px;
      margin-bottom: 30px;
      border: 1px solid #24324f;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
      transition: 0.3s;
    }
    .header:hover {
      transform: translateY(-3px);
      border-color: rgba(99, 102, 241, 0.3);
    }
    .header h1 {
      font-size: 2.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    .header p {
      color: #94a3b8;
      margin-top: 10px;
      font-size: 1.05rem;
    }

    /* ===== İLERLEME ===== */
    .progress-wrap {
      background: #1e2942;
      border-radius: 30px;
      height: 10px;
      margin-bottom: 25px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #f59e0b);
      transition: width 0.6s ease;
      border-radius: 30px;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
    }
    .stats {
      display: flex;
      justify-content: space-between;
      background: #131c2e;
      padding: 14px 22px;
      border-radius: 16px;
      border: 1px solid #24324f;
      margin-bottom: 28px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }
    .stats span {
      font-weight: 600;
      color: #94a3b8;
      font-size: 0.95rem;
    }
    .stats .count {
      color: #f59e0b;
      font-weight: 700;
    }

    /* ===== SORU KARTLARI ===== */
    .question-card {
      background: #131c2e;
      border: 1px solid #24324f;
      border-radius: 24px;
      padding: 26px;
      margin-bottom: 26px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      transition: 0.3s;
    }
    .question-card:hover {
      transform: translateY(-4px);
      border-color: rgba(99, 102, 241, 0.3);
      box-shadow: 0 16px 35px rgba(0, 0, 0, 0.4);
    }
    .question-card .q-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .question-card .q-head .badge {
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .question-card .q-head .status {
      color: #94a3b8;
      font-size: 0.8rem;
      font-weight: 500;
    }
    .question-card .q-text {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.6;
      margin-bottom: 20px;
      color: #e2e8f0;
    }

    /* ===== ŞIKLAR ===== */
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .option {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      background: rgba(11, 15, 25, 0.5);
      border: 2px solid #24324f;
      border-radius: 14px;
      cursor: pointer;
      transition: 0.25s;
    }
    .option:hover {
      border-color: rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.02);
      transform: translateX(4px);
    }
    .option input {
      display: none;
    }
    .option .dot {
      width: 22px;
      height: 22px;
      border: 2px solid #94a3b8;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: 0.25s;
    }
    .option .dot::after {
      content: '';
      width: 10px;
      height: 10px;
      background: #f59e0b;
      border-radius: 50%;
      transform: scale(0);
      transition: 0.25s;
    }
    .option input:checked + .dot {
      border-color: #f59e0b;
    }
    .option input:checked + .dot::after {
      transform: scale(1);
    }
    .option input:checked ~ .option-text {
      color: #fff;
      font-weight: 600;
    }
    .option .option-text {
      color: #cbd5e1;
      font-size: 0.98rem;
    }
    .blank-option {
      border-style: dashed;
      color: #94a3b8;
      font-style: italic;
    }
    .blank-option .option-text {
      color: #94a3b8;
    }

    /* ===== GÖNDER BUTONU ===== */
    .btn-submit {
      width: 100%;
      padding: 22px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: none;
      border-radius: 28px;
      font-size: 1.4rem;
      font-weight: 800;
      color: #0b0f19;
      cursor: pointer;
      box-shadow: 0 18px 40px rgba(245, 158, 11, 0.25);
      transition: 0.3s;
      margin-top: 16px;
      position: relative;
      overflow: hidden;
    }
    .btn-submit:hover {
      transform: translateY(-5px);
      box-shadow: 0 24px 50px rgba(245, 158, 11, 0.4);
    }
    .btn-submit:active {
      transform: scale(0.97);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      transform: none;
      pointer-events: none;
    }
    .btn-submit .spinner {
      display: none;
      width: 24px;
      height: 24px;
      border: 3px solid #0b0f19;
      border-top: 3px solid transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .btn-submit.loading .btn-text {
      display: none;
    }
    .btn-submit.loading .spinner {
      display: block;
    }

    /* ===== BAŞARI EKRANI ===== */
    .success-screen {
      display: none;
      text-align: center;
      padding: 50px 20px;
      background: #111827;
      border: 2px solid #10b981;
      border-radius: 28px;
      margin-top: 20px;
      box-shadow: 0 20px 50px rgba(16, 185, 129, 0.15);
      animation: fadeInUp 0.6s ease;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .success-screen .icon {
      font-size: 4.8rem;
      display: block;
      margin-bottom: 12px;
    }
    .success-screen h2 {
      color: #10b981;
      font-size: 2.2rem;
      font-weight: 800;
    }
    .success-screen p {
      color: #94a3b8;
      font-size: 1.1rem;
      margin-top: 10px;
      line-height: 1.6;
    }

    /* ===== TOAST ===== */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #10b981;
      color: #fff;
      padding: 16px 32px;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1rem;
      box-shadow: 0 12px 35px rgba(16, 185, 129, 0.3);
      opacity: 0;
      transition: 0.5s;
      pointer-events: none;
      backdrop-filter: blur(6px);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast.error {
      background: #ef4444;
      box-shadow: 0 12px 35px rgba(239, 68, 68, 0.3);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 500px) {
      .header h1 { font-size: 2rem; }
      .question-card .q-text { font-size: 1rem; }
      .option { padding: 12px 14px; }
      .btn-submit { font-size: 1.2rem; padding: 18px; }
    }
  </style>
</head>
<body>
  <div class="wrapper">

    <!-- HEADER -->
    <div class="header">
      <h1>🎯 KPSS Özel Deneme</h1>
      <p>Soruları dikkatle oku, en doğru şıkkı seç. Başarılar! 🍀</p>
    </div>

    <!-- İLERLEME -->
    <div class="stats">
      <span>📌 Cevaplanan: <span class="count" id="answeredCount">0</span> / <span id="totalQ">20</span></span>
      <span>📊 <span id="progressPercent">0</span>%</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- SORULAR -->
    <div id="quizArea"></div>

    <!-- GÖNDER BUTONU -->
    <button class="btn-submit" id="submitBtn" onclick="submitExam()">
      <span class="btn-text">🚀 Sınavı Tamamla ve Gönder</span>
      <span class="spinner"></span>
    </button>

    <!-- BAŞARI EKRANI -->
    <div class="success-screen" id="successScreen">
      <span class="icon">✅</span>
      <h2>Cevaplarınız İletildi!</h2>
      <p>Cevaplarınız hocanıza başarıyla ulaştı.<br />Sonuçlarınız en kısa sürede paylaşılacaktır.</p>
    </div>

  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script>
    // ================================================================
    // EMAILJS AYARLARI (REST API)
    // ================================================================
    const PUBLIC_KEY = "dbF3yWuvy9um9nAdp";
    const SERVICE_ID = "service_qdab76q";
    const TEMPLATE_ID = "template_64cuej9";

    // ================================================================
    // 20 SORU
    // ================================================================
    const questions = [
      { q: "Aşağıdakilerden hangisi Türkiye'de görülen iklim tiplerinden biri değildir?", opts: ["Akdeniz", "Karasal", "Muson", "Karadeniz", "Marmara"], ans: 2 },
      { q: "TBMM hangi tarihte açılmıştır?", opts: ["23 Nisan 1920", "29 Ekim 1923", "19 Mayıs 1919", "30 Ağustos 1922", "15 Temmuz 2016"], ans: 0 },
      { q: "Aşağıdakilerden hangisi ısı alışverişi türü değildir?", opts: ["Konveksiyon", "Radyasyon", "Kondüksiyon", "Adveksiyon", "Süblimleşme"], ans: 4 },
      { q: "Türk Dil Kurumu hangi amaçla kurulmuştur?", opts: ["Türkçeyi arındırmak", "Doğru kullanım sağlamak", "Geliştirmek", "Hepsi", "Hiçbiri"], ans: 3 },
      { q: "Kurtuluş Savaşı'nda Batı Cephesi'nde yapılmayan savaş?", opts: ["I. İnönü", "II. İnönü", "Kütahya-Eskişehir", "Sakarya", "Çanakkale"], ans: 4 },
      { q: "Türkiye'nin en uzun akarsuyu?", opts: ["Fırat", "Dicle", "Kızılırmak", "Sakarya", "Yeşilırmak"], ans: 2 },
      { q: "Tanzimat Fermanı hangi padişah döneminde ilan edildi?", opts: ["II. Mahmud", "Abdülmecid", "Abdülaziz", "V. Murad", "II. Abdülhamid"], ans: 1 },
      { q: "UNESCO Dünya Mirası'ndaki Türk şehri?", opts: ["İstanbul", "Ankara", "İzmir", "Bursa", "Antalya"], ans: 0 },
      { q: "En çok yağış alan bölge?", opts: ["Doğu Anadolu", "Karadeniz", "Akdeniz", "Ege", "Marmara"], ans: 1 },
      { q: "Halkçılık ilkesi neyi savunur?", opts: ["Milli birlik", "Sosyal adalet", "Laiklik", "Devletçilik", "Cumhuriyet"], ans: 1 },
      { q: "Hangisi milli park değildir?", opts: ["Göreme", "Olimpos", "Yedigöller", "Sapanca", "Kazdağları"], ans: 3 },
      { q: "Türkiye'nin en kalabalık şehri?", opts: ["Ankara", "İstanbul", "İzmir", "Bursa", "Antalya"], ans: 1 },
      { q: "Hangisi yapım ekidir?", opts: ["-ler", "-de", "-den", "-lik", "-e"], ans: 3 },
      { q: "Hangisi Türkiye'de çıkarılmaz?", opts: ["Kömür", "Demir", "Altın", "Elmas", "Boksit"], ans: 3 },
      { q: "Cumhuriyet kaç yılında ilan edildi?", opts: ["1920", "1921", "1922", "1923", "1924"], ans: 3 },
      { q: "Hangisi ulaşım türü değildir?", opts: ["Kara", "Deniz", "Hava", "Demir", "Uzay"], ans: 4 },
      { q: "Türkiye'nin en büyük gölü?", opts: ["Van", "Tuz", "Beyşehir", "Eğirdir", "İznik"], ans: 0 },
      { q: "Hangisi Anadolu uygarlığı değildir?", opts: ["Hitit", "Frig", "Urartu", "Mısır", "Lidya"], ans: 3 },
      { q: "Türkiye'nin başkenti?", opts: ["Ankara", "İstanbul", "İzmir", "Bursa", "Eskişehir"], ans: 0 },
      { q: "Hangisi yazılım dili değildir?", opts: ["Python", "Java", "C++", "HTML", "Photoshop"], ans: 4 }
    ];

    // ================================================================
    // DEĞİŞKENLER
    // ================================================================
    let answered = new Set();
    const total = questions.length;
    document.getElementById('totalQ').textContent = total;

    // ================================================================
    // SORULARI BAS
    // ================================================================
    function renderQuestions() {
      const area = document.getElementById('quizArea');
      let html = '';
      questions.forEach((q, idx) => {
        html += `
          <div class="question-card" id="q-${idx}">
            <div class="q-head">
              <span class="badge">Soru ${idx + 1}</span>
              <span class="status" id="status-${idx}">Boş</span>
            </div>
            <div class="q-text">${q.q}</div>
            <div class="options">
        `;
        q.opts.forEach((opt, oi) => {
          html += `
            <label class="option" onclick="selectOption(${idx}, ${oi})">
              <input type="radio" name="q${idx}" value="${oi}" />
              <span class="dot"></span>
              <span class="option-text">${opt}</span>
            </label>
          `;
        });
        html += `
            <label class="option blank-option" onclick="selectBlank(${idx})">
              <input type="radio" name="q${idx}" value="blank" checked />
              <span class="dot"></span>
              <span class="option-text">Bu soruyu boş bırak</span>
            </label>
          </div>
        </div>`;
      });
      area.innerHTML = html;
    }

    // ================================================================
    // SEÇİM
    // ================================================================
    function selectOption(qIdx, optIdx) {
      const radio = document.querySelector(`input[name="q${qIdx}"][value="${optIdx}"]`);
      if (radio) {
        radio.checked = true;
        document.querySelectorAll(`input[name="q${qIdx}"]`).forEach(r => {
          if (r.value !== String(optIdx)) r.checked = false;
        });
      }
      updateStatus(qIdx);
    }

    function selectBlank(qIdx) {
      const radio = document.querySelector(`input[name="q${qIdx}"][value="blank"]`);
      if (radio) radio.checked = true;
      updateStatus(qIdx);
    }

    function updateStatus(qIdx) {
      const selected = document.querySelector(`input[name="q${qIdx}"]:checked`);
      const status = document.getElementById(`status-${qIdx}`);
      if (!selected || selected.value === 'blank') {
        answered.delete(qIdx);
        status.textContent = 'Boş';
        status.style.color = '#94a3b8';
      } else {
        answered.add(qIdx);
        const letters = ['A', 'B', 'C', 'D', 'E'];
        status.textContent = letters[parseInt(selected.value)];
        status.style.color = '#f59e0b';
      }
      updateProgress();
    }

    function updateProgress() {
      const count = answered.size;
      const percent = Math.round((count / total) * 100);
      document.getElementById('answeredCount').textContent = count;
      document.getElementById('progressPercent').textContent = percent;
      document.getElementById('progressBar').style.width = percent + '%';
    }

    // ================================================================
    // GÖNDER (REST API ile)
    // ================================================================
    function submitExam() {
      const btn = document.getElementById('submitBtn');
      // Butonu devre dışı bırak ve loading göster
      btn.disabled = true;
      btn.classList.add('loading');

      // Cevapları topla
      let list = [];
      let bos = 0;
      questions.forEach((q, idx) => {
        const sel = document.querySelector(`input[name="q${idx}"]:checked`);
        const val = sel ? sel.value : 'blank';
        const harf = val === 'blank' ? 'Boş' : ['A', 'B', 'C', 'D', 'E'][parseInt(val)];
        list.push(`Soru ${idx+1}: ${harf}`);
        if (val === 'blank') bos++;
      });

      const mesaj =
        `📝 2026 KPSS Deneme Cevapları\n\n${list.join('\n')}\n\n✅ Cevaplanan: ${total - bos}\n⬜ Boş: ${bos}`;

      // EmailJS REST API'ye istek
      const url = 'https://api.emailjs.com/api/v1.0/email/send';
      const data = {
        service_id: SERVICE_ID,
        template_id: TEMPLATE_ID,
        user_id: PUBLIC_KEY,
        template_params: {
          subject: 'Yeni KPSS Deneme Cevapları',
          message: mesaj
        }
      };

      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(response => {
        if (response.ok) {
          // Başarılı
          document.getElementById('quizArea').style.display = 'none';
          document.querySelector('.stats').style.display = 'none';
          document.querySelector('.progress-wrap').style.display = 'none';
          document.querySelector('.header').style.display = 'none';
          document.getElementById('successScreen').style.display = 'block';
          window.scrollTo({ top: 0, behavior: 'smooth' });
          showToast('✅ Cevaplar başarıyla gönderildi!');
        } else {
          // Hata
          response.text().then(text => {
            showToast('❌ Gönderme hatası: ' + text, true);
          });
        }
      })
      .catch(error => {
        showToast('❌ Ağ hatası: ' + error, true);
        console.error(error);
      })
      .finally(() => {
        // Butonu eski haline getir
        btn.disabled = false;
        btn.classList.remove('loading');
      });
    }

    // ================================================================
    // TOAST
    // ================================================================
    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast';
      if (isError) t.classList.add('error');
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 5000);
    }

    // ================================================================
    // BAŞLAT
    // ================================================================
    renderQuestions();
  </script>
</body>
</html>

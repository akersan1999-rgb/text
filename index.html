<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 KPSS Deneme Sınavı</title>
  <script src="https://cdn.emailjs.com/dist/email.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    body {
      background: #0b0f19;
      color: #f1f5f9;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      max-width: 700px;
      width: 100%;
      background: #131c2e;
      border-radius: 28px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      border: 1px solid #24324f;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
      background: linear-gradient(135deg, #ffffff, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .sub {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 25px;
      font-size: 0.95rem;
    }
    .progress-wrap {
      background: #1e2942;
      border-radius: 30px;
      height: 8px;
      margin-bottom: 30px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #f59e0b);
      transition: width 0.5s ease;
    }
    .stats {
      display: flex;
      justify-content: space-between;
      background: #0b0f19;
      padding: 12px 20px;
      border-radius: 16px;
      margin-bottom: 25px;
      border: 1px solid #24324f;
      font-weight: 600;
    }
    .stats span:last-child {
      color: #f59e0b;
    }
    .question {
      background: #0b0f19;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 20px;
      border: 1px solid #24324f;
    }
    .question .qhead {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 12px;
    }
    .question .qhead .badge {
      background: rgba(99,102,241,0.2);
      padding: 4px 12px;
      border-radius: 30px;
      color: #818cf8;
      font-weight: 700;
    }
    .question .qtext {
      font-weight: 600;
      font-size: 1.05rem;
      margin-bottom: 16px;
      line-height: 1.6;
    }
    .option {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      background: rgba(255,255,255,0.03);
      border: 2px solid #24324f;
      border-radius: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: 0.3s;
    }
    .option:hover {
      border-color: rgba(255,255,255,0.2);
    }
    .option input {
      display: none;
    }
    .option .circle {
      width: 22px;
      height: 22px;
      border: 2px solid #24324f;
      border-radius: 50%;
      margin-right: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: 0.3s;
    }
    .option .circle::after {
      content: '';
      width: 10px;
      height: 10px;
      background: #f59e0b;
      border-radius: 50%;
      transform: scale(0);
      transition: 0.3s;
    }
    .option input:checked + .circle {
      border-color: #f59e0b;
    }
    .option input:checked + .circle::after {
      transform: scale(1);
    }
    .option input:checked ~ .option-text {
      color: #fff;
      font-weight: 600;
    }
    .option-text {
      color: #94a3b8;
    }
    .blank-option {
      border-style: dashed;
      color: #94a3b8;
      font-style: italic;
    }
    .btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: none;
      border-radius: 16px;
      font-size: 1.2rem;
      font-weight: 800;
      color: #0b0f19;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
      box-shadow: 0 10px 30px rgba(245,158,11,0.2);
    }
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(245,158,11,0.3);
    }
    .btn:active {
      transform: scale(0.96);
    }

    /* Başarı ekranı (öğrenci görür) – SADECE TEK BİR MESAJ */
    #success-screen {
      display: none;
      text-align: center;
      padding: 40px 20px;
      animation: pop 0.6s ease;
    }
    @keyframes pop {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    #success-screen .icon {
      font-size: 4rem;
      display: block;
      margin-bottom: 15px;
    }
    #success-screen h2 {
      color: #10b981;
      font-size: 1.8rem;
      margin-bottom: 10px;
    }
    #success-screen p {
      color: #94a3b8;
      font-size: 1rem;
      line-height: 1.6;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #10b981;
      color: #fff;
      padding: 14px 28px;
      border-radius: 60px;
      font-weight: 700;
      opacity: 0;
      transition: 0.5s;
      z-index: 999;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 500px) {
      .container { padding: 20px; }
      h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

<div class="container">

  <h1>🎯 2026 KPSS Deneme</h1>
  <p class="sub">Soruları dikkatle oku, doğru şıkkı işaretle.</p>

  <!-- İlerleme -->
  <div class="progress-wrap">
    <div class="progress-bar" id="progress"></div>
  </div>

  <!-- Durum -->
  <div class="stats">
    <span>📝 Cevaplanan</span>
    <span id="countDisplay">0 / 20</span>
  </div>

  <!-- Sınav formu -->
  <div id="quiz-area">
    <div id="questions"></div>
    <button class="btn" id="submitBtn">Sınavı Gönder 🚀</button>
  </div>

  <!-- BAŞARI EKRANI (öğrenci sadece bunu görür) -->
  <div id="success-screen">
    <span class="icon">✅</span>
    <h2>Cevaplarınız İletildi!</h2>
    <p>Cevaplarınız hocanıza başarıyla ulaştı.<br />Sonuçlarınızı hocanız yayınladığında burada görebileceksiniz.</p>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast">✅ Cevaplar gönderildi!</div>

<script>
  // ================================================================
  // EMAILJS – KENDİ BİLGİLERİNLE DEĞİŞTİR!
  // ================================================================
  (function() {
    emailjs.init("user_...");   // Public Key
  })();

  const SERVICE_ID = "service_qdab76q";
  const TEMPLATE_ID = "template_...";
  const YOUR_EMAIL = "akersan1999@gmail.com";

  // ================================================================
  // SORULAR (20 adet, güncel KPSS tarzı)
  // ================================================================
  const sorular = [
    { q: "Aşağıdakilerden hangisi Türkiye'de görülen iklim tiplerinden biri değildir?", s: ["Akdeniz", "Karasal", "Muson", "Karadeniz", "Marmara"], a: 2 },
    { q: "TBMM hangi tarihte açılmıştır?", s: ["23 Nisan 1920", "29 Ekim 1923", "19 Mayıs 1919", "30 Ağustos 1922", "15 Temmuz 2016"], a: 0 },
    { q: "Hangisi ısı alışveriş türü değildir?", s: ["Konveksiyon", "Radyasyon", "Kondüksiyon", "Adveksiyon", "Süblimleşme"], a: 4 },
    { q: "Türk Dil Kurumu hangi amaçla kurulmuştur?", s: ["Türkçeyi arındırmak", "Doğru kullanım sağlamak", "Geliştirmek", "Hepsi", "Hiçbiri"], a: 3 },
    { q: "Kurtuluş Savaşı'nda Batı Cephesi'nde yapılmayan savaş?", s: ["I. İnönü", "II. İnönü", "Kütahya-Eskişehir", "Sakarya", "Çanakkale"], a: 4 },
    { q: "Türkiye'nin en uzun akarsuyu?", s: ["Fırat", "Dicle", "Kızılırmak", "Sakarya", "Yeşilırmak"], a: 2 },
    { q: "Tanzimat Fermanı hangi padişah döneminde?", s: ["II. Mahmud", "Abdülmecid", "Abdülaziz", "V. Murad", "II. Abdülhamid"], a: 1 },
    { q: "UNESCO Dünya Mirası'ndaki Türk şehri?", s: ["İstanbul", "Ankara", "İzmir", "Bursa", "Antalya"], a: 0 },
    { q: "En çok yağış alan bölge?", s: ["Doğu Anadolu", "Karadeniz", "Akdeniz", "Ege", "Marmara"], a: 1 },
    { q: "Atatürk ilkelerinden sosyal adaleti hedefleyen?", s: ["Cumhuriyetçilik", "Milliyetçilik", "Halkçılık", "Devletçilik", "Laiklik"], a: 2 },
    { q: "Hangisi milli park değildir?", s: ["Göreme", "Olimpos", "Yedigöller", "Sapanca", "Kazdağları"], a: 3 },
    { q: "En kalabalık şehir?", s: ["Ankara", "İstanbul", "İzmir", "Bursa", "Antalya"], a: 1 },
    { q: "Hangisi yapım ekidir?", s: ["-ler", "-de", "-den", "-lik", "-e"], a: 3 },
    { q: "Türkiye'de çıkarılmayan maden?", s: ["Kömür", "Demir", "Altın", "Elmas", "Boksit"], a: 3 },
    { q: "Cumhuriyet kaç yılında ilan edildi?", s: ["1920", "1921", "1922", "1923", "1924"], a: 3 },
    { q: "Hangisi ulaşım türü değildir?", s: ["Kara", "Deniz", "Hava", "Demir", "Uzay"], a: 4 },
    { q: "Türkiye'nin en büyük gölü?", s: ["Van", "Tuz", "Beyşehir", "Eğirdir", "İznik"], a: 0 },
    { q: "Anadolu'da kurulmamış uygarlık?", s: ["Hitit", "Frig", "Urartu", "Mısır", "Lidya"], a: 3 },
    { q: "Başkent neresidir?", s: ["Ankara", "İstanbul", "İzmir", "Bursa", "Eskişehir"], a: 0 },
    { q: "Hangisi yazılım dili değildir?", s: ["Python", "Java", "C++", "HTML", "Photoshop"], a: 4 }
  ];

  // ================================================================
  // RENDER
  // ================================================================
  const root = document.getElementById('questions');
  let cevaplanan = new Set();

  function render() {
    let html = '';
    sorular.forEach((item, idx) => {
      html += `
        <div class="question" id="q-${idx}">
          <div class="qhead">
            <span class="badge">Soru ${idx+1}</span>
            <span id="status-${idx}" style="color:#94a3b8;">Boş</span>
          </div>
          <div class="qtext">${item.q}</div>
      `;
      item.s.forEach((opt, oi) => {
        const letter = String.fromCharCode(65 + oi); // A,B,C,D,E
        html += `
          <label class="option" onclick="sec(${idx}, ${oi})">
            <input type="radio" name="q${idx}" value="${oi}" />
            <span class="circle"></span>
            <span class="option-text">${letter}) ${opt}</span>
          </label>
        `;
      });
      // Boş bırak seçeneği
      html += `
          <label class="option blank-option" onclick="secBos(${idx})">
            <input type="radio" name="q${idx}" value="blank" checked />
            <span class="circle"></span>
            <span class="option-text">Bu soruyu boş bırak</span>
          </label>
        </div>
      `;
    });
    root.innerHTML = html;
    guncelle();
  }

  // ================================================================
  // SEÇİM
  // ================================================================
  window.sec = function(idx, oi) {
    const radio = document.querySelector(`input[name="q${idx}"][value="${oi}"]`);
    if (radio) radio.checked = true;
    cevaplanan.add(idx);
    document.getElementById(`status-${idx}`).textContent = String.fromCharCode(65 + oi);
    document.getElementById(`status-${idx}`).style.color = '#f59e0b';
    guncelle();
  };

  window.secBos = function(idx) {
    const radio = document.querySelector(`input[name="q${idx}"][value="blank"]`);
    if (radio) radio.checked = true;
    cevaplanan.delete(idx);
    document.getElementById(`status-${idx}`).textContent = 'Boş';
    document.getElementById(`status-${idx}`).style.color = '#94a3b8';
    guncelle();
  };

  function guncelle() {
    const count = cevaplanan.size;
    document.getElementById('countDisplay').textContent = `${count} / ${sorular.length}`;
    document.getElementById('progress').style.width = `${(count / sorular.length) * 100}%`;
  }

  // ================================================================
  // GÖNDER
  // ================================================================
  document.getElementById('submitBtn').addEventListener('click', function() {
    // Cevapları topla
    let cevapList = [];
    let bos = 0;
    sorular.forEach((s, idx) => {
      const secili = document.querySelector(`input[name="q${idx}"]:checked`);
      const val = secili ? secili.value : 'blank';
      const harf = val === 'blank' ? 'Boş' : String.fromCharCode(65 + parseInt(val));
      cevapList.push(`Soru ${idx+1}: ${harf}`);
      if (val === 'blank') bos++;
    });

    const toplam = sorular.length;
    const cevaplananSayi = toplam - bos;
    const mesaj = `📝 2026 KPSS Deneme Cevapları\n\n${cevapList.join('\n')}\n\n✅ Cevaplanan: ${cevaplananSayi}\n⬜ Boş: ${bos}`;

    // EmailJS gönder
    const params = {
      subject: 'Yeni KPSS Deneme Cevapları',
      message: mesaj
    };

    emailjs.send(SERVICE_ID, TEMPLATE_ID, params)
      .then(() => {
        // Başarılı -> sınavı gizle, başarı ekranını göster
        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('success-screen').style.display = 'block';
        toastGoster('✅ Cevaplar gönderildi!');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      })
      .catch((err) => {
        alert('❌ Gönderme hatası: ' + JSON.stringify(err));
        console.error(err);
      });
  });

  // ================================================================
  // TOAST
  // ================================================================
  function toastGoster(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 4000);
  }

  // ================================================================
  // BAŞLAT
  // ================================================================
  render();
</script>
</body>
</html>
